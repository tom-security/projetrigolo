<title>DODGE TRAINER</title>
<style>
:root{
  --bg:#07080f;
  --ink:#e8ecff;
  --dim:#8a92b8;
  --accent:#4de3ff;
  --accent2:#ff4d7a;
  --gold:#ffd166;
  --danger:#ff3b30;
  --panel:rgba(12,14,26,.88);
  --line:rgba(120,140,220,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{
  font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* ---------- Overlays ---------- */
.overlay{
  position:absolute;inset:0;
  display:flex;justify-content:center;
  /* align-items:center + overflow:auto coupe le haut du panneau quand il est
     plus grand que l'écran, et le rend inatteignable au défilement. On aligne
     en haut et on recentre via margin:auto sur l'enfant, qui lui reste
     accessible dans les deux cas. */
  align-items:flex-start;
  background:radial-gradient(1200px 800px at 50% 40%,rgba(20,26,54,.72),rgba(4,5,12,.95));
  backdrop-filter:blur(7px);
  z-index:10;
  padding:24px;
  overflow-y:auto;
}
.overlay.hidden{display:none}
.panel{
  margin:auto;                 /* centre verticalement sans jamais rogner le haut */
  width:min(920px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px 34px 26px;
  box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
}
.panel.narrow{width:min(520px,100%);text-align:center}

.title{
  font-size:clamp(34px,6vw,58px);
  font-weight:800;letter-spacing:.06em;line-height:1;
  text-shadow:0 0 28px rgba(77,227,255,.35);
}
.title span{color:var(--accent)}
.title.small{font-size:clamp(26px,4vw,38px)}
.dead-title{color:var(--accent2);text-shadow:0 0 30px rgba(255,77,122,.45)}
.tagline{color:var(--dim);margin:10px 0 22px;font-size:14.5px;line-height:1.5}

.section-label{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin:18px 0 10px;font-weight:700;
}

/* ---------- Difficultés ---------- */
.diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.diff-card{
  position:relative;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px 12px;
  cursor:pointer;
  transition:transform .12s ease,border-color .12s,background .12s;
  text-align:left;
  color:inherit;font:inherit;
}
.diff-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
.diff-card.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:0 0 0 1px var(--c),0 10px 30px -12px var(--c)}
.diff-card .dname{font-weight:800;font-size:15px;letter-spacing:.03em;color:var(--c)}
.diff-card .dsub{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.diff-card .dbest{font-size:11px;color:var(--gold);margin-top:8px;font-variant-numeric:tabular-nums}

.diff-details{
  margin-top:14px;padding:14px 16px;
  border:1px dashed var(--line);border-radius:12px;
  background:rgba(0,0,0,.25);
  font-size:13px;line-height:1.6;color:#c3cbe8;
}
.diff-details h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c,#4de3ff);margin-bottom:8px}
.diff-details ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px}
.diff-details li::before{content:"▸ ";color:var(--c,#4de3ff)}
.diff-details .warn{margin-top:10px;color:var(--accent2);font-weight:600}

/* ---------- Toggles ---------- */
.toggle-row{display:flex;gap:8px;flex-wrap:wrap}
.toggle-row.small{margin-top:14px}
.toggle{
  flex:1;min-width:130px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:11px;
  color:var(--dim);font:inherit;font-size:13px;font-weight:600;
  padding:11px 12px;cursor:pointer;transition:.12s;
}
.toggle em{font-style:normal;opacity:.65;font-weight:400;font-size:11.5px}
.toggle:hover{background:rgba(255,255,255,.07)}
.toggle.on{border-color:var(--accent);color:var(--ink);background:rgba(77,227,255,.13)}
.toggle.mini{flex:0 0 auto;min-width:0;padding:7px 12px;font-size:11.5px;border-radius:9px}
.hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}

/* ---------- Boutons ---------- */
.primary{
  display:block;width:100%;margin-top:22px;
  background:linear-gradient(135deg,var(--accent),#3aa8ff);
  border:0;border-radius:12px;
  color:#04121a;font:inherit;font-weight:800;font-size:16px;letter-spacing:.08em;
  padding:15px;cursor:pointer;
  box-shadow:0 12px 34px -12px var(--accent);
  transition:transform .1s,filter .12s;
}
.primary em{font-style:normal;opacity:.6;font-size:12px}
.primary:hover{filter:brightness(1.1)}
.primary:active{transform:translateY(1px)}
.ghost{
  display:block;width:100%;margin-top:9px;
  background:transparent;border:1px solid var(--line);border-radius:11px;
  color:var(--dim);font:inherit;font-size:13px;font-weight:600;padding:11px;cursor:pointer;
}
.ghost:hover{color:var(--ink);border-color:var(--accent)}

/* ---------- Contrôles ---------- */
.controls{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px 20px;
  font-size:11.5px;color:var(--dim);
}
.controls b{color:var(--ink);font-weight:700}
.controls em{font-style:normal;opacity:.6}

/* ---------- Écran de mort ---------- */
.death-cause{color:var(--accent2);font-size:14px;font-weight:600;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.record .v{color:var(--gold)}
.verdict{font-size:13px;color:#c3cbe8;line-height:1.55;min-height:20px;margin-bottom:6px}
.verdict b{color:var(--accent)}

@media (max-width:620px){
  .panel{padding:22px 18px}
  .controls{font-size:11px;gap:4px 14px}
}

/* ---------- Sélecteur de mode (ajout : deux moteurs cohabitent) ---------- */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode-card{
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px 15px;
  cursor:pointer;text-align:left;
  color:inherit;font:inherit;
  transition:transform .12s ease,border-color .12s,background .12s;
}
.mode-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
.mode-card.active{
  border-color:var(--c);
  background:color-mix(in srgb,var(--c) 14%,transparent);
  box-shadow:0 0 0 1px var(--c),0 12px 34px -14px var(--c);
}
.mode-card .mname{font-weight:800;font-size:16px;letter-spacing:.04em;color:var(--c)}
.mode-card .mtag{
  display:inline-block;margin-top:5px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:2px 7px;
}
.mode-card .mdesc{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.45}

/* ---------- Signature sur les écrans secondaires ---------- */
.eyebrow{
  font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
  font-weight:700;color:var(--dim);margin-bottom:10px;
}
</style>

/* ==== js/util.js ==== */
/* ==========================================================================
   util.js — maths, aléatoire déterministe, helpers de rendu
   ========================================================================== */
(function (root) {
  'use strict';

  const TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function inv(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function approach(cur, target, delta) {
    return cur < target ? Math.min(cur + delta, target) : Math.max(cur - delta, target);
  }

  function len(x, y) { return Math.hypot(x, y); }
  function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
  function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }

  /** Différence d'angle la plus courte, dans ]-PI, PI]. */
  function angDelta(from, to) {
    let d = (to - from) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  /** Distance d'un point au segment AB. */
  function distToSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    if (l2 === 0) return Math.hypot(px - ax, py - ay);
    let t = ((px - ax) * dx + (py - ay) * dy) / l2;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  // ---- Aléatoire ----------------------------------------------------------
  /** PRNG mulberry32 : rapide, déterministe, suffisant pour du gameplay. */
  function makeRng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Hash 2D -> [0,1[ : sert à générer les secteurs de la carte infinie. */
  function hash2(x, y, salt) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(salt | 0, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  const rnd = Math.random;
  function rr(a, b) { return a + rnd() * (b - a); }
  function ri(a, b) { return Math.floor(a + rnd() * (b - a + 1)); }
  function pick(arr) { return arr[(rnd() * arr.length) | 0]; }
  function chance(p) { return rnd() < p; }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  /** Tirage pondéré : items = [{w:number, ...}]. */
  function weighted(items, weightOf) {
    let total = 0;
    for (const it of items) total += Math.max(0, weightOf(it));
    if (total <= 0) return items[0];
    let r = rnd() * total;
    for (const it of items) {
      r -= Math.max(0, weightOf(it));
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  }

  // ---- Formatage ----------------------------------------------------------
  function fmtTime(s) {
    if (s < 0) s = 0;
    const m = Math.floor(s / 60);
    const rest = s - m * 60;
    return m > 0
      ? m + ':' + (rest < 10 ? '0' : '') + rest.toFixed(2)
      : rest.toFixed(2) + 's';
  }

  // ---- Rendu --------------------------------------------------------------
  /** Halo radial peu coûteux (remplace shadowBlur dans les boucles chaudes). */
  function glow(ctx, x, y, r, inner, outer) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, inner);
    g.addColorStop(1, outer);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  function rgba(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  root.U = {
    TAU, clamp, lerp, inv, smooth, approach,
    len, dist, dist2, angDelta, distToSeg,
    makeRng, hash2, rr, ri, pick, chance, shuffle, weighted,
    fmtTime, glow, rgba
  };
})(window);

<script>
/* ==== js/input.js ==== */
/* ==========================================================================
   input.js — clavier (AZERTY + QWERTY + flèches) et gestes tactiles
   ========================================================================== */
(function (root) {
  'use strict';

  const down = Object.create(null);
  const pressed = Object.create(null);   // vidé à chaque frame consommée

  const MAP = {
    up:    ['KeyW', 'KeyZ', 'ArrowUp'],
    down:  ['KeyS', 'ArrowDown'],
    left:  ['KeyA', 'KeyQ', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],
    dash:  ['Space'],
    focus: ['ShiftLeft', 'ShiftRight'],
    adren: ['KeyE'],
    pause: ['Escape', 'KeyP'],
    retry: ['KeyR']
  };

  function held(action) {
    const codes = MAP[action];
    for (let i = 0; i < codes.length; i++) if (down[codes[i]]) return true;
    return false;
  }

  function tapped(action) {
    const codes = MAP[action];
    for (let i = 0; i < codes.length; i++) {
      if (pressed[codes[i]]) { pressed[codes[i]] = false; return true; }
    }
    return false;
  }

  /** Vecteur de déplacement normalisé (clavier, ou joystick tactile). */
  function axis() {
    let x = 0, y = 0;
    if (held('left')) x -= 1;
    if (held('right')) x += 1;
    if (held('up')) y -= 1;
    if (held('down')) y += 1;
    if (x === 0 && y === 0 && touch.active) { x = touch.dx; y = touch.dy; }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  const touch = { active: false, dx: 0, dy: 0, id: null, ox: 0, oy: 0 };

  function clearAll() {
    for (const k in down) down[k] = false;
    for (const k in pressed) pressed[k] = false;
    touch.active = false; touch.dx = 0; touch.dy = 0; touch.id = null;
  }

  function attach(canvas) {
    window.addEventListener('keydown', e => {
      // Évite que Espace / flèches fassent défiler la page.
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (!e.repeat) pressed[e.code] = true;
      down[e.code] = true;
    }, { passive: false });

    window.addEventListener('keyup', e => { down[e.code] = false; });
    window.addEventListener('blur', clearAll);

    // --- Tactile : joystick virtuel relatif au point de contact ----------
    canvas.addEventListener('touchstart', e => {
      const t = e.changedTouches[0];
      touch.id = t.identifier; touch.ox = t.clientX; touch.oy = t.clientY;
      touch.active = true; touch.dx = 0; touch.dy = 0;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier !== touch.id) continue;
        const dx = t.clientX - touch.ox, dy = t.clientY - touch.oy;
        const l = Math.hypot(dx, dy) || 1;
        const s = Math.min(l, 52) / 52;
        touch.dx = dx / l * s; touch.dy = dy / l * s;
      }
      e.preventDefault();
    }, { passive: false });

    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === touch.id) { touch.active = false; touch.dx = 0; touch.dy = 0; touch.id = null; }
      }
    };
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('touchcancel', end);
  }

  root.Input = { attach, held, tapped, axis, clearAll };
})(window);
</script>
<script>
/* ==== js/fx.js ==== */
/* ==========================================================================
   fx.js — particules, secousses, textes flottants, flashs
   Tout est en pool fixe : aucune allocation pendant le jeu.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U;

  const MAX_P = 900;

  function Fx() {
    this.p = new Array(MAX_P);
    for (let i = 0; i < MAX_P; i++) {
      this.p[i] = { on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, r: 2, c: '#fff', drag: 2.2, glow: false };
    }
    this.head = 0;
    this.texts = [];
    this.shake = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.flash = 0;
    this.flashColor = '#fff';
    this.quality = 'high';
    this.shakeEnabled = true;
  }

  Fx.prototype.reset = function () {
    for (let i = 0; i < MAX_P; i++) this.p[i].on = false;
    this.texts.length = 0;
    this.shake = this.shakeX = this.shakeY = this.flash = 0;
  };

  Fx.prototype.spawn = function (x, y, vx, vy, life, r, c, drag, glow) {
    const q = this.p[this.head];
    this.head = (this.head + 1) % MAX_P;
    q.on = true; q.x = x; q.y = y; q.vx = vx; q.vy = vy;
    q.life = life; q.max = life; q.r = r; q.c = c;
    q.drag = drag === undefined ? 2.2 : drag;
    q.glow = !!glow;
  };

  /** Gerbe radiale (explosions, morts, impacts). */
  Fx.prototype.burst = function (x, y, n, color, speed, size, life) {
    if (this.quality === 'low') n = Math.ceil(n * 0.4);
    for (let i = 0; i < n; i++) {
      const a = U.rr(0, U.TAU), s = U.rr(speed * 0.25, speed);
      this.spawn(x, y, Math.cos(a) * s, Math.sin(a) * s,
        U.rr(life * 0.55, life), U.rr(size * 0.5, size), color, 2.4, true);
    }
  };

  /** Anneau net vers l'extérieur (onde de choc). */
  Fx.prototype.ring = function (x, y, n, radius, color, speed) {
    if (this.quality === 'low') n = Math.ceil(n * 0.45);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * U.TAU;
      this.spawn(x + Math.cos(a) * radius, y + Math.sin(a) * radius,
        Math.cos(a) * speed, Math.sin(a) * speed, U.rr(0.3, 0.55), U.rr(1.6, 3), color, 3.0, false);
    }
  };

  /** Traînée discrète (dash, projectiles rapides). */
  Fx.prototype.trail = function (x, y, color, size) {
    if (this.quality === 'low' && Math.random() < 0.5) return;
    this.spawn(x + U.rr(-2, 2), y + U.rr(-2, 2), U.rr(-18, 18), U.rr(-18, 18),
      U.rr(0.18, 0.34), size || 2.6, color, 4.5, false);
  };

  Fx.prototype.text = function (x, y, str, color, size, rise) {
    this.texts.push({ x, y, s: str, c: color || '#fff', size: size || 15, life: 1.1, max: 1.1, rise: rise === undefined ? 44 : rise });
    if (this.texts.length > 24) this.texts.shift();
  };

  Fx.prototype.kick = function (amount) {
    if (!this.shakeEnabled) return;
    this.shake = Math.min(this.shake + amount, 34);
  };

  Fx.prototype.blink = function (color, amount) {
    this.flash = Math.max(this.flash, amount);
    this.flashColor = color;
  };

  Fx.prototype.update = function (dt) {
    for (let i = 0; i < MAX_P; i++) {
      const q = this.p[i];
      if (!q.on) continue;
      q.life -= dt;
      if (q.life <= 0) { q.on = false; continue; }
      const d = Math.max(0, 1 - q.drag * dt);
      q.vx *= d; q.vy *= d;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }

    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      t.y -= t.rise * dt;
      if (t.life <= 0) this.texts.splice(i, 1);
    }

    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 46);
      this.shakeX = U.rr(-this.shake, this.shake);
      this.shakeY = U.rr(-this.shake, this.shake);
    } else { this.shakeX = this.shakeY = 0; }

    if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 2.6);
  };

  Fx.prototype.drawParticles = function (ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < MAX_P; i++) {
      const q = this.p[i];
      if (!q.on) continue;
      const a = q.life / q.max;
      ctx.globalAlpha = a * a;
      ctx.fillStyle = q.c;
      const r = q.r * (0.4 + a * 0.6);
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, U.TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  };

  Fx.prototype.drawTexts = function (ctx) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of this.texts) {
      const a = U.clamp(t.life / t.max * 1.6, 0, 1);
      ctx.globalAlpha = a;
      ctx.font = '800 ' + t.size + 'px Segoe UI, Inter, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(0,0,0,.65)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.c;
      ctx.fillText(t.s, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  };

  /** Voile plein écran (dessiné en espace écran, après la caméra). */
  Fx.prototype.drawFlash = function (ctx, w, h) {
    if (this.flash <= 0) return;
    ctx.globalAlpha = Math.min(this.flash, 0.85);
    ctx.fillStyle = this.flashColor;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  };

  root.Fx = Fx;
})(window);
</script>
<script>
/* ==== js/arena.js ==== */
/* ==========================================================================
   arena.js — terrain, champ d'effondrement, caméra
   --------------------------------------------------------------------------
   Deux modes :
     · closed  : arène circulaire fixe qui rétrécit par paliers. Le terrain
                 d'entraînement classique — rien à fuir, tout à esquiver.
     · endless : carte procédurale infinie (secteurs générés par hash) avec
                 piliers bloquants, flaques ralentissantes et plaques de
                 recharge. Le champ d'effondrement poursuit le joueur MOINS
                 vite qu'il ne court : fuir gagne du temps mais coûte de la
                 jauge, et le champ finit toujours par refermer.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG;

  function Arena(game) {
    this.game = game;
    this.endless = false;
    this.cx = 0; this.cy = 0;
    this.radius = 400;
    this.baseRadius = 400;
    this.targetRadius = 400;
    this.phase = 0;
    this.seed = 1;
    this.sectors = new Map();
    this.nearby = [];           // features du secteur courant + voisins
    this.outTimer = 0;
    this.travelled = 0;
    this.camX = 0; this.camY = 0;
  }

  Arena.prototype.init = function (diff, endless, seed) {
    this.endless = !!endless;
    this.diff = diff;
    this.seed = seed >>> 0;
    this.baseRadius = diff.arenaRadius * (endless ? CFG.ENDLESS.radiusMul : 1);
    this.radius = this.baseRadius;
    this.targetRadius = this.baseRadius;
    this.cx = 0; this.cy = 0;
    this.camX = 0; this.camY = 0;
    this.phase = 0;
    this.outTimer = 0;
    this.travelled = 0;
    this.sectors.clear();
    this.nearby.length = 0;
  };

  /* --- Génération procédurale -------------------------------------------- */
  Arena.prototype.sectorAt = function (sx, sy) {
    const key = sx + ',' + sy;
    let s = this.sectors.get(key);
    if (s) return s;

    const S = CFG.ENDLESS.sector;
    const feats = [];
    const n = 2 + Math.floor(U.hash2(sx, sy, this.seed) * 3);   // 2..4 éléments
    for (let i = 0; i < n; i++) {
      const hx = U.hash2(sx * 31 + i, sy * 17, this.seed + 7);
      const hy = U.hash2(sx * 13, sy * 29 + i, this.seed + 91);
      const ht = U.hash2(sx + i * 101, sy - i * 57, this.seed + 404);
      const hr = U.hash2(sx - i * 7, sy + i * 3, this.seed + 1337);
      const x = sx * S + hx * S;
      const y = sy * S + hy * S;
      let kind, r;
      if (ht < 0.46) { kind = 'pillar'; r = U.lerp(CFG.ENDLESS.pillarR[0], CFG.ENDLESS.pillarR[1], hr); }
      else if (ht < 0.84) { kind = 'sludge'; r = U.lerp(CFG.ENDLESS.sludgeR[0], CFG.ENDLESS.sludgeR[1], hr); }
      else { kind = 'charge'; r = 30; }
      feats.push({ kind, x, y, r, used: 0 });
    }
    s = { feats };
    this.sectors.set(key, s);
    if (this.sectors.size > 400) {                 // purge : mémoire bornée
      const first = this.sectors.keys().next().value;
      this.sectors.delete(first);
    }
    return s;
  };

  Arena.prototype.refreshNearby = function (px, py) {
    const S = CFG.ENDLESS.sector;
    const sx = Math.floor(px / S), sy = Math.floor(py / S);
    this.nearby.length = 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const s = this.sectorAt(sx + dx, sy + dy);
        for (const f of s.feats) this.nearby.push(f);
      }
    }
  };

  /** Un pilier coupe-t-il le segment AB ? (les projectiles s'y écrasent) */
  Arena.prototype.blocks = function (ax, ay, bx, by) {
    if (!this.endless) return null;
    for (const f of this.nearby) {
      if (f.kind !== 'pillar') continue;
      if (U.distToSeg(f.x, f.y, ax, ay, bx, by) < f.r) return f;
    }
    return null;
  };

  Arena.prototype.featureAt = function (x, y, kind) {
    for (const f of this.nearby) {
      if (f.kind !== kind) continue;
      if (U.dist2(x, y, f.x, f.y) < f.r * f.r) return f;
    }
    return null;
  };

  /* --- Mise à jour -------------------------------------------------------- */
  Arena.prototype.update = function (dt, player, elapsed) {
    const d = this.diff;

    // Rétrécissement par paliers : la pression monte, puis respire un peu.
    const phase = Math.floor(elapsed / d.shrinkPeriod);
    const k = (elapsed % d.shrinkPeriod) / d.shrinkPeriod;
    const floor = U.lerp(1, d.shrinkTo, U.clamp(phase / 4, 0, 1));
    this.targetRadius = this.baseRadius * U.lerp(floor, floor * 0.88, U.smooth(k));
    this.radius = U.approach(this.radius, this.targetRadius, 42 * dt);

    if (this.endless) {
      // Le champ poursuit le joueur, plus lentement que lui.
      const chase = d.playerSpeed * CFG.ENDLESS.chaseSpeedRatio;
      const dx = player.x - this.cx, dy = player.y - this.cy;
      const l = Math.hypot(dx, dy);
      if (l > 1) {
        const step = Math.min(chase * dt, l);
        this.cx += dx / l * step;
        this.cy += dy / l * step;
      }
      this.refreshNearby(player.x, player.y);
      this.travelled += Math.hypot(player.vx, player.vy) * dt;
    }

    // Hors limites : compte à rebours, puis mort. Le sursis dépend de la difficulté.
    const out = U.dist(player.x, player.y, this.cx, this.cy) - this.radius;
    if (out > 0) {
      this.outTimer += dt;
      player.outOfBounds = true;
      player.outRatio = U.clamp(this.outTimer / d.outOfBoundsGrace, 0, 1);
      if (this.outTimer >= d.outOfBoundsGrace) return 'collapse';
    } else {
      this.outTimer = Math.max(0, this.outTimer - dt * 2.2);
      player.outOfBounds = false;
      player.outRatio = this.outTimer / d.outOfBoundsGrace;
    }
    return null;
  };

  /** Caméra : centrée sur l'arène en mode fermé, suivi souple sinon. */
  Arena.prototype.updateCamera = function (dt, player, w, h) {
    let tx, ty;
    if (this.endless) {
      tx = player.x + player.vx * 0.16;
      ty = player.y + player.vy * 0.16;
    } else {
      tx = this.cx + (player.x - this.cx) * 0.12;
      ty = this.cy + (player.y - this.cy) * 0.12;
    }
    const s = 1 - Math.pow(0.0015, dt);
    this.camX += (tx - this.camX) * s;
    this.camY += (ty - this.camY) * s;
  };

  /* --- Rendu -------------------------------------------------------------- */
  Arena.prototype.drawFloor = function (ctx, view) {
    const { x0, y0, x1, y1 } = view;

    // Grille de fond : repère de mouvement, indispensable pour lire sa vitesse.
    const g = 62;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(90,110,190,.075)';
    ctx.beginPath();
    for (let x = Math.floor(x0 / g) * g; x < x1; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = Math.floor(y0 / g) * g; y < y1; y += g) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();

    if (this.endless) this.drawFeatures(ctx);
  };

  Arena.prototype.drawFeatures = function (ctx) {
    for (const f of this.nearby) {
      if (f.kind === 'pillar') {
        // Couverture solide : doit se lire d'un coup d'œil, on s'abrite derrière.
        ctx.fillStyle = 'rgba(26,34,66,.99)';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, U.TAU); ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(150,180,255,.85)';
        ctx.stroke();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(150,180,255,.30)';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.62, 0, U.TAU); ctx.stroke();
      } else if (f.kind === 'sludge') {
        // Flaque ralentissante : traversable, mais elle se paie.
        ctx.fillStyle = 'rgba(126,44,176,.22)';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, U.TAU); ctx.fill();
        U.glow(ctx, f.x, f.y, f.r, 'rgba(180,80,230,.26)', 'rgba(150,60,200,0)');
        ctx.save();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(210,140,255,.75)';
        ctx.setLineDash([9, 7]);
        ctx.lineDashOffset = -performance.now() * 0.012;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, U.TAU); ctx.stroke();
        ctx.restore();
      } else {
        const pulse = 0.6 + Math.sin(performance.now() * 0.005 + f.x) * 0.4;
        const alpha = f.used > 0 ? 0.12 : 0.55;
        U.glow(ctx, f.x, f.y, f.r * (1 + pulse * 0.25),
          'rgba(255,209,102,' + (alpha * 0.6) + ')', 'rgba(255,209,102,0)');
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,209,102,' + alpha + ')';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, U.TAU); ctx.stroke();
      }
    }
  };

  /** Bord de l'arène + voile rouge sur la zone létale. */
  Arena.prototype.drawBounds = function (ctx, view, elapsed) {
    const r = this.radius;
    const danger = this.outTimer > 0;

    ctx.save();
    // Assombrit tout ce qui est hors du cercle.
    ctx.beginPath();
    ctx.rect(view.x0, view.y0, view.x1 - view.x0, view.y1 - view.y0);
    ctx.arc(this.cx, this.cy, r, 0, U.TAU, true);
    ctx.fillStyle = danger ? 'rgba(120,10,25,.42)' : 'rgba(80,10,30,.26)';
    ctx.fill();
    ctx.restore();

    // Anneau : pointillés qui tournent, plus vifs quand ça rétrécit.
    const shrinking = this.radius - this.targetRadius > 1.2;
    ctx.save();
    ctx.lineWidth = shrinking ? 4 : 2.5;
    ctx.strokeStyle = danger ? '#ff3b30' : (shrinking ? '#ff8a3d' : 'rgba(120,150,255,.55)');
    ctx.setLineDash([16, 12]);
    ctx.lineDashOffset = -elapsed * 26;
    ctx.beginPath();
    ctx.arc(this.cx, this.cy, r, 0, U.TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Cercle intérieur : cible du challenge « rester au centre ».
    const ch = this.game.objectives && this.game.objectives.activeChallenge;
    if (ch && ch.cond === 'inner') {
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,209,102,.55)';
      ctx.setLineDash([8, 10]);
      ctx.lineDashOffset = elapsed * 40;
      ctx.beginPath();
      ctx.arc(this.cx, this.cy, r * 0.42, 0, U.TAU);
      ctx.stroke();
      ctx.restore();
    }
  };

  Arena.prototype.innerRadius = function () { return this.radius * 0.42; };

  root.Arena = Arena;
})(window);
</script>
<script>
/* ==== js/entities.js ==== */
/* ==========================================================================
   entities.js — dangers. Aucun n'appartient au joueur : il n'attaque pas.
   --------------------------------------------------------------------------
   Contrat commun :
     update(dt, game) -> false pour mourir
     draw(ctx, game)
     hits(px, py, pr) -> bool           (létal maintenant ?)
     edge(px, py)     -> distance à la surface (frôlement ; -1 = non frôlable)
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U;

  /* ====================== BULLET ========================================= */
  function Bullet(o) {
    this.x = o.x; this.y = o.y;
    this.vx = o.vx; this.vy = o.vy;
    this.r = o.r || 7;
    this.c = o.c || '#4de3ff';
    this.life = o.life === undefined ? 9 : o.life;
    this.delay = o.delay || 0;
    this.curve = o.curve || 0;          // rad/s appliqués au vecteur vitesse
    this.accel = o.accel || 0;          // px/s² le long de la vitesse
    this.homing = o.homing || 0;        // rad/s de correction vers le joueur
    this.homingTime = o.homingTime === undefined ? 999 : o.homingTime;
    this.trail = o.trail !== false;
    this.dead = false;
    this.age = 0;
  }

  Bullet.prototype.update = function (dt, game) {
    this.age += dt;
    if (this.delay > 0) { this.delay -= dt; return true; }

    this.life -= dt;
    if (this.life <= 0) return false;

    let a = Math.atan2(this.vy, this.vx);
    let s = Math.hypot(this.vx, this.vy);

    if (this.curve) a += this.curve * dt;
    if (this.homing && this.age < this.homingTime) {
      const want = Math.atan2(game.player.y - this.y, game.player.x - this.x);
      const d = U.angDelta(a, want);
      a += U.clamp(d, -this.homing * dt, this.homing * dt);
    }
    if (this.accel) s = Math.max(20, s + this.accel * dt);

    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s;

    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt;

    // Les piliers de la carte infinie arrêtent les projectiles : ce sont de
    // vraies couvertures, pas de la décoration.
    const wall = game.arena.blocks(this.x, this.y, nx, ny);
    if (wall) {
      game.fx.burst(this.x, this.y, 5, this.c, 130, 2.4, 0.3);
      return false;
    }

    this.x = nx; this.y = ny;

    if (this.trail && s > 260) game.fx.trail(this.x, this.y, this.c, this.r * 0.35);

    // Purge serrée : hors de l'arène, un projectile n'est plus une information,
    // c'est du bruit. La marge couvre les patterns qui naissent au-delà du bord.
    const lim = game.arena.radius + 240;
    if (U.dist2(this.x, this.y, game.arena.cx, game.arena.cy) > lim * lim) return false;
    return true;
  };

  Bullet.prototype.hits = function (px, py, pr) {
    if (this.delay > 0) return false;
    const rr = this.r + pr;
    return U.dist2(px, py, this.x, this.y) < rr * rr;
  };

  Bullet.prototype.edge = function (px, py) {
    if (this.delay > 0) return -1;
    return U.dist(px, py, this.x, this.y) - this.r;
  };

  Bullet.prototype.draw = function (ctx) {
    if (this.delay > 0) {
      // Point d'apparition : on voit où ça va sortir, une fraction avant.
      ctx.globalAlpha = 0.5 + Math.sin(this.age * 40) * 0.3;
      ctx.fillStyle = this.c;
      ctx.beginPath(); ctx.arc(this.x, this.y, 2.2, 0, U.TAU); ctx.fill();
      ctx.globalAlpha = 1;
      return;
    }
    U.glow(ctx, this.x, this.y, this.r * 2.6, U.rgba(this.c, 0.34), U.rgba(this.c, 0));
    ctx.fillStyle = this.c;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.42, 0, U.TAU); ctx.fill();
  };

  /* ====================== BLAST (les « grosses boules ») ================== *
   * Trois temps : télégraphe -> détonation -> persistance.                   *
   * La persistance est LE curseur de difficulté demandé : courte en easy,    *
   * interminable en infernal, et elle s'allonge encore avec l'intensité.     */
  function Blast(o) {
    this.x = o.x; this.y = o.y;
    this.r = o.r;
    this.tele = o.tele;
    this.teleMax = o.tele;
    this.linger = o.linger;
    this.lingerMax = o.linger;
    this.secondary = o.secondary || 0;
    this.c = o.c || '#ff8a3d';
    this.state = 'tele';
    this.t = 0;
    this.grow = o.grow || 0;            // le rayon peut enfler pendant l'explosion
  }

  Blast.prototype.update = function (dt, game) {
    this.t += dt;
    if (this.state === 'tele') {
      this.tele -= dt;
      if (this.tele <= 0) {
        this.state = 'boom';
        game.fx.burst(this.x, this.y, 46, this.c, 460, 5, 0.75);
        game.fx.ring(this.x, this.y, 30, this.r * 0.35, '#fff', 520);
        game.fx.kick(this.r * 0.055);
        game.audio.boom();
      }
      return true;
    }
    this.linger -= dt;
    if (this.grow) this.r += this.grow * dt;
    if (this.linger <= 0) {
      if (this.secondary > 0) {
        // Répliques : l'erreur ne se paie pas une fois, elle se paie en chaîne.
        for (let i = 0; i < this.secondary; i++) {
          const a = U.rr(0, U.TAU), d = U.rr(this.r * 0.7, this.r * 1.5);
          game.hazards.push(new Blast({
            x: this.x + Math.cos(a) * d,
            y: this.y + Math.sin(a) * d,
            r: this.r * 0.62,
            tele: Math.max(0.18, this.teleMax * 0.55),
            linger: this.lingerMax * 0.6,
            secondary: 0,
            c: '#ff5a3d'
          }));
        }
      }
      return false;
    }
    return true;
  };

  Blast.prototype.hits = function (px, py, pr) {
    if (this.state !== 'boom') return false;
    const rr = this.r + pr;
    return U.dist2(px, py, this.x, this.y) < rr * rr;
  };

  Blast.prototype.edge = function (px, py) {
    if (this.state !== 'boom') return -1;
    return Math.abs(U.dist(px, py, this.x, this.y) - this.r);
  };

  Blast.prototype.draw = function (ctx) {
    if (this.state === 'tele') {
      const k = 1 - this.tele / this.teleMax;
      const urgent = this.tele < 0.3;
      // Disque d'avertissement + anneau qui se referme : deux lectures,
      // l'une périphérique, l'autre précise.
      U.glow(ctx, this.x, this.y, this.r, U.rgba(this.c, 0.10 + k * 0.16), U.rgba(this.c, 0));
      ctx.lineWidth = 2;
      ctx.strokeStyle = U.rgba(this.c, 0.45);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();

      ctx.lineWidth = urgent ? 5 : 3.5;
      ctx.strokeStyle = urgent ? '#fff' : this.c;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * (1 - k * 0.82), 0, U.TAU); ctx.stroke();

      if (urgent) {
        ctx.globalAlpha = 0.25 + Math.sin(this.t * 60) * 0.2;
        ctx.fillStyle = this.c;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      return;
    }

    // Persistance : opacité dégressive MAIS létalité constante jusqu'au bout.
    // Le contour blanc reste net pour qu'on ne se fasse jamais avoir par le fade.
    const k = this.linger / this.lingerMax;
    const a = 0.30 + k * 0.42;
    U.glow(ctx, this.x, this.y, this.r * 1.12, U.rgba('#fff2c0', a * 0.75), U.rgba(this.c, 0));
    ctx.fillStyle = U.rgba(this.c, a * 0.55);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();
  };

  /* ====================== LASER ========================================== */
  function Laser(o) {
    this.x = o.x; this.y = o.y;
    this.a = o.a;
    this.len = o.len || 2000;
    this.w = o.w || 16;
    this.tele = o.tele;
    this.teleMax = o.tele;
    this.active = o.active;
    this.activeMax = o.active;
    this.spin = o.spin || 0;
    this.c = o.c || '#ff4d7a';
    this.state = 'tele';
  }

  Laser.prototype.update = function (dt, game) {
    this.a += this.spin * dt;
    if (this.state === 'tele') {
      this.tele -= dt;
      if (this.tele <= 0) { this.state = 'on'; game.fx.kick(2.5); game.audio.zap(); }
      return true;
    }
    this.active -= dt;
    return this.active > 0;
  };

  Laser.prototype._seg = function () {
    return [this.x, this.y, this.x + Math.cos(this.a) * this.len, this.y + Math.sin(this.a) * this.len];
  };

  Laser.prototype.hits = function (px, py, pr) {
    if (this.state !== 'on') return false;
    const s = this._seg();
    return U.distToSeg(px, py, s[0], s[1], s[2], s[3]) < this.w * 0.5 + pr;
  };

  Laser.prototype.edge = function (px, py) {
    if (this.state !== 'on') return -1;
    const s = this._seg();
    return U.distToSeg(px, py, s[0], s[1], s[2], s[3]) - this.w * 0.5;
  };

  Laser.prototype.draw = function (ctx) {
    const s = this._seg();
    ctx.save();
    if (this.state === 'tele') {
      const k = 1 - this.tele / this.teleMax;
      ctx.lineWidth = 1 + k * 3;
      ctx.strokeStyle = U.rgba(this.c, 0.25 + k * 0.5);
      ctx.setLineDash([14, 10]);
      ctx.lineDashOffset = -performance.now() * 0.04;
    } else {
      const k = this.active / this.activeMax;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = this.w * (0.75 + k * 0.45);
      ctx.strokeStyle = U.rgba(this.c, 0.55);
      ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
      ctx.lineWidth = this.w * 0.38;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
    }
    ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
    ctx.restore();
  };

  /* ====================== WALL (mur à brèche) ============================= */
  function Wall(o) {
    this.a = o.a;                       // direction de déplacement (normale)
    this.x = o.x; this.y = o.y;         // point courant sur la normale
    this.speed = o.speed;
    this.half = o.half || 1200;         // demi-longueur du mur
    this.thick = o.thick || 14;
    this.gap = o.gap;                   // position de la brèche le long du mur
    this.gapHalf = o.gapHalf;
    this.c = o.c || '#a78bfa';
    this.tele = o.tele;
    this.teleMax = o.tele;
    this.life = o.life || 7;
    this.drift = o.drift || 0;          // la brèche peut glisser : il faut suivre
  }

  Wall.prototype.update = function (dt) {
    if (this.tele > 0) { this.tele -= dt; return true; }
    this.x += Math.cos(this.a) * this.speed * dt;
    this.y += Math.sin(this.a) * this.speed * dt;
    this.gap += this.drift * dt;
    this.life -= dt;
    return this.life > 0;
  };

  Wall.prototype._parts = function () {
    const tx = -Math.sin(this.a), ty = Math.cos(this.a);   // tangente
    const a1x = this.x + tx * -this.half, a1y = this.y + ty * -this.half;
    const b1x = this.x + tx * (this.gap - this.gapHalf), b1y = this.y + ty * (this.gap - this.gapHalf);
    const a2x = this.x + tx * (this.gap + this.gapHalf), a2y = this.y + ty * (this.gap + this.gapHalf);
    const b2x = this.x + tx * this.half, b2y = this.y + ty * this.half;
    return [a1x, a1y, b1x, b1y, a2x, a2y, b2x, b2y];
  };

  Wall.prototype.hits = function (px, py, pr) {
    if (this.tele > 0) return false;
    const p = this._parts();
    const t = this.thick * 0.5 + pr;
    return U.distToSeg(px, py, p[0], p[1], p[2], p[3]) < t ||
           U.distToSeg(px, py, p[4], p[5], p[6], p[7]) < t;
  };

  Wall.prototype.edge = function (px, py) {
    if (this.tele > 0) return -1;
    const p = this._parts();
    return Math.min(
      U.distToSeg(px, py, p[0], p[1], p[2], p[3]),
      U.distToSeg(px, py, p[4], p[5], p[6], p[7])
    ) - this.thick * 0.5;
  };

  Wall.prototype.draw = function (ctx) {
    const p = this._parts();
    ctx.save();
    if (this.tele > 0) {
      ctx.globalAlpha = 0.35 + (1 - this.tele / this.teleMax) * 0.4;
      ctx.setLineDash([12, 9]);
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = this.thick;
    ctx.strokeStyle = U.rgba(this.c, 0.55);
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[4], p[5]); ctx.lineTo(p[6], p[7]); ctx.stroke();
    ctx.lineWidth = this.thick * 0.42;
    ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(p[2], p[3]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p[4], p[5]); ctx.lineTo(p[6], p[7]); ctx.stroke();
    ctx.restore();
  };

  /* ====================== CHASER (orbe traqueuse) ========================= */
  function Chaser(o) {
    this.x = o.x; this.y = o.y;
    this.a = o.a;
    this.speed = o.speed;
    this.turn = o.turn;
    this.r = o.r || 12;
    this.life = o.life || 9;
    this.c = o.c || '#ff4d7a';
    this.tele = o.tele || 0;
    this.teleMax = this.tele;
  }

  Chaser.prototype.update = function (dt, game) {
    if (this.tele > 0) { this.tele -= dt; return true; }
    this.life -= dt;
    if (this.life <= 0) {
      game.fx.burst(this.x, this.y, 10, this.c, 160, 3, 0.4);
      return false;
    }
    const want = Math.atan2(game.player.y - this.y, game.player.x - this.x);
    this.a += U.clamp(U.angDelta(this.a, want), -this.turn * dt, this.turn * dt);
    this.x += Math.cos(this.a) * this.speed * dt;
    this.y += Math.sin(this.a) * this.speed * dt;
    game.fx.trail(this.x, this.y, this.c, this.r * 0.4);
    return true;
  };

  Chaser.prototype.hits = function (px, py, pr) {
    if (this.tele > 0) return false;
    const rr = this.r + pr;
    return U.dist2(px, py, this.x, this.y) < rr * rr;
  };

  Chaser.prototype.edge = function (px, py) {
    if (this.tele > 0) return -1;
    return U.dist(px, py, this.x, this.y) - this.r;
  };

  Chaser.prototype.draw = function (ctx) {
    if (this.tele > 0) {
      ctx.globalAlpha = 0.4 + Math.sin(this.tele * 30) * 0.3;
      ctx.lineWidth = 2; ctx.strokeStyle = this.c;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 1.8, 0, U.TAU); ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }
    U.glow(ctx, this.x, this.y, this.r * 3, U.rgba(this.c, 0.3), U.rgba(this.c, 0));
    ctx.fillStyle = this.c;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.55, 0, U.TAU); ctx.stroke();
  };

  root.Ent = { Bullet, Blast, Laser, Wall, Chaser };
})(window);
</script>
<script>
/* ==== js/patterns.js ==== */
/* ==========================================================================
   patterns.js — bibliothèque d'attaques
   --------------------------------------------------------------------------
   Chaque pattern porte des poids : skill / spam / brutal. Le directeur tire
   dedans selon le profil de la difficulté — c'est là que se joue la promesse
   « easy & medium = skill, hard & ultra = skill + spam, infernal = inhumain ».
   tier = palier d'intensité minimum avant d'apparaître (progressivité).
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, E = root.Ent;

  /* --- Helpers de contexte ------------------------------------------------ */
  function edgePoint(c, ang, pad) {
    const R = c.arena.radius + (pad === undefined ? 40 : pad);
    return { x: c.arena.cx + Math.cos(ang) * R, y: c.arena.cy + Math.sin(ang) * R };
  }

  /** Visée à l'avance. err = bruit en radians (0 = parfait, réservé à Infernal). */
  function lead(c, sx, sy, speed, err) {
    const p = c.player;
    let t = U.dist(sx, sy, p.x, p.y) / Math.max(60, speed);
    for (let i = 0; i < 2; i++) {
      const tx = p.x + p.vx * t, ty = p.y + p.vy * t;
      t = U.dist(sx, sy, tx, ty) / Math.max(60, speed);
    }
    const tx = p.x + p.vx * t, ty = p.y + p.vy * t;
    return Math.atan2(ty - sy, tx - sx) + (err ? U.rr(-err, err) : 0);
  }

  function push(c, e) { c.game.hazards.push(e); }

  /** Origine d'un pattern radial, jamais collée au joueur.
      Un anneau qui apparaît sur la tête n'est pas de la difficulté, c'est un
      tirage au sort. On repousse l'origine à minDist du joueur. */
  function safeOrigin(c, minDist, spread) {
    const p = c.player, a = c.arena;
    for (let i = 0; i < 12; i++) {
      const ang = U.rr(0, U.TAU), d = U.rr(0, spread);
      const x = a.cx + Math.cos(ang) * d, y = a.cy + Math.sin(ang) * d;
      if (U.dist(x, y, p.x, p.y) >= minDist) return { x, y };
    }
    // Repli : on part à l'opposé du joueur par rapport au centre.
    const ang = Math.atan2(a.cy - p.y, a.cx - p.x);
    return { x: a.cx + Math.cos(ang) * minDist * 0.8, y: a.cy + Math.sin(ang) * minDist * 0.8 };
  }

  /** Rayon d'apparition des patterns radiaux : le point d'origine reste un
      abri. C'est ce qui rend un anneau lisible plutôt qu'aléatoire. */
  const HUB = 52;

  /* ========================================================================
     TIER 0 — lecture pure
     ===================================================================== */

  /** Anneau qui s'ouvre : il faut choisir sa brèche AVANT qu'elle n'arrive. */
  function ringBurst(c) {
    const n = Math.round(c.cnt(26));
    const gaps = 1 + (c.I > 2 ? 1 : 0);
    const gapAt = [];
    for (let g = 0; g < gaps; g++) gapAt.push(U.rr(0, U.TAU));
    const gapW = U.lerp(0.55, 0.30, U.clamp(c.I / 5, 0, 1));
    const sp = c.spd(155);
    const o = safeOrigin(c, 190, 110);

    for (let i = 0; i < n; i++) {
      const a = (i / n) * U.TAU;
      let skip = false;
      for (const g of gapAt) if (Math.abs(U.angDelta(a, g)) < gapW) { skip = true; break; }
      if (skip) continue;
      push(c, new E.Bullet({
        x: o.x + Math.cos(a) * HUB, y: o.y + Math.sin(a) * HUB,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 7, c: '#4de3ff', delay: 0.30 * c.teleMul, life: 8
      }));
    }
  }

  /** Salve visée en éventail : on esquive perpendiculairement, pas en reculant. */
  function aimedVolley(c) {
    const shots = Math.round(c.cnt(4));
    const from = edgePoint(c, U.rr(0, U.TAU));
    const sp = c.spd(240);
    for (let i = 0; i < shots; i++) {
      c.sched(i * (0.22 / Math.max(1, c.I * 0.4)), () => {
        const a = lead(c, from.x, from.y, sp, c.aimError);
        const spread = U.lerp(0.20, 0.06, U.clamp(c.I / 5, 0, 1));
        for (let k = -1; k <= 1; k++) {
          push(c, new E.Bullet({
            x: from.x, y: from.y,
            vx: Math.cos(a + k * spread) * sp, vy: Math.sin(a + k * spread) * sp,
            r: 8, c: '#ffd166', delay: 0.16 * c.teleMul
          }));
        }
      });
    }
  }

  /** LES GROSSES BOULES. Le curseur central de la difficulté. */
  function bombCluster(c) {
    const A = c.diff.aoe;
    const n = U.ri(A.count[0], A.count[1]) + Math.floor(c.I * 0.35);
    const linger = A.linger + A.lingerGrowth * c.I;       // persistance progressive
    const tele = Math.max(0.12, A.telegraph * c.sonarMul);
    const p = c.player;

    for (let i = 0; i < n; i++) {
      c.sched(i * U.rr(0.05, 0.19), () => {
        let x, y;
        if (i === 0) {
          // La première tombe toujours sur la position anticipée : on ne peut
          // pas rester immobile.
          x = p.x + p.vx * tele * 0.75;
          y = p.y + p.vy * tele * 0.75;
        } else {
          const a = U.rr(0, U.TAU), d = U.rr(40, c.arena.radius * 0.85);
          x = c.arena.cx + Math.cos(a) * d;
          y = c.arena.cy + Math.sin(a) * d;
        }
        push(c, new E.Blast({
          x, y, r: A.radius * U.rr(0.85, 1.15),
          tele, linger, secondary: A.secondary,
          c: '#ff8a3d', grow: c.diff.id === 'infernal' ? 22 : 0
        }));
      });
    }
  }

  /* ========================================================================
     TIER 1 — placement et timing
     ===================================================================== */

  /** Balayage laser : lecture de l'angle, on traverse au bon moment. */
  function laserSweep(c) {
    const from = edgePoint(c, U.rr(0, U.TAU), -10);
    const toward = Math.atan2(c.arena.cy - from.y, c.arena.cx - from.x);
    const dir = U.chance(0.5) ? 1 : -1;
    const spin = U.lerp(0.35, 1.25, U.clamp(c.I / 5, 0, 1)) * dir;
    push(c, new E.Laser({
      x: from.x, y: from.y, a: toward - dir * 0.8,
      w: 20, tele: 0.85 * c.teleMul, active: U.lerp(1.6, 2.6, U.clamp(c.I / 5, 0, 1)),
      spin, c: '#ff4d7a'
    }));
  }

  /** Étoile de lasers depuis le centre : il y a toujours un secteur sûr. */
  function laserStar(c) {
    const arms = Math.max(3, Math.round(c.cnt(5)));
    const base = U.rr(0, U.TAU);
    const spin = (U.chance(0.5) ? 1 : -1) * U.lerp(0.10, 0.55, U.clamp(c.I / 5, 0, 1));
    for (let i = 0; i < arms; i++) {
      const a = base + (i / arms) * U.TAU;
      // Les bras partent d'un anneau, pas d'un point : le moyeu reste jouable
      // (et le défi « rester au centre » garde un sens).
      push(c, new E.Laser({
        x: c.arena.cx + Math.cos(a) * 58, y: c.arena.cy + Math.sin(a) * 58, a,
        w: 16, tele: 1.0 * c.teleMul, active: 1.8, spin, c: '#ff4d7a'
      }));
    }
  }

  /** Mur à brèche : positionnement pur, la brèche dérive. */
  function wallGap(c) {
    const a = U.rr(0, U.TAU);
    const start = edgePoint(c, a + Math.PI, 60);
    const gapHalf = U.lerp(78, 40, U.clamp(c.I / 5, 0, 1));
    push(c, new E.Wall({
      x: start.x, y: start.y, a,
      speed: c.spd(160), half: c.arena.radius + 200,
      gap: U.rr(-c.arena.radius * 0.5, c.arena.radius * 0.5),
      gapHalf, thick: 16, tele: 0.75 * c.teleMul,
      life: (c.arena.radius * 2.4) / c.spd(160),
      drift: c.I > 2.5 ? U.rr(-70, 70) : 0
    }));
  }

  /** Orbes traqueuses : on apprend à les faire tourner, pas à les fuir. */
  function chasers(c) {
    const n = Math.max(1, Math.round(c.cnt(2.5)));
    for (let i = 0; i < n; i++) {
      const a = U.rr(0, U.TAU);
      const from = edgePoint(c, a, -30);
      push(c, new E.Chaser({
        x: from.x, y: from.y, a: a + Math.PI,
        speed: c.spd(150), turn: U.lerp(0.9, 2.4, U.clamp(c.I / 5, 0, 1)),
        r: 13, life: U.lerp(6, 11, U.clamp(c.I / 5, 0, 1)),
        tele: 0.5 * c.teleMul, c: '#ff4d7a'
      }));
    }
  }

  /* ========================================================================
     TIER 2 — flux continus
     ===================================================================== */

  /** Spirale : lire la rotation, se déplacer à contresens. */
  function spiral(c) {
    const arms = Math.max(2, Math.round(c.cnt(3)));
    const ticks = Math.round(U.lerp(14, 34, U.clamp(c.I / 5, 0, 1)));
    const rot = (U.chance(0.5) ? 1 : -1) * U.rr(0.18, 0.42);
    const sp = c.spd(175);
    const o = safeOrigin(c, 150, 90);
    for (let t = 0; t < ticks; t++) {
      c.sched(t * 0.085, () => {
        for (let k = 0; k < arms; k++) {
          const a = t * rot + (k / arms) * U.TAU;
          push(c, new E.Bullet({
            x: o.x + Math.cos(a) * HUB, y: o.y + Math.sin(a) * HUB,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: 6.5, c: '#7b8cff', life: 8
          }));
        }
      });
    }
  }

  /** Vortex : trajectoires incurvées, les couloirs bougent tout seuls. */
  function vortex(c) {
    const n = Math.round(c.cnt(22));
    const curve = (U.chance(0.5) ? 1 : -1) * U.rr(0.5, 1.15);
    const sp = c.spd(150);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * U.TAU;
      const from = edgePoint(c, a, -20);
      push(c, new E.Bullet({
        x: from.x, y: from.y,
        vx: Math.cos(a + Math.PI) * sp, vy: Math.sin(a + Math.PI) * sp,
        r: 6.5, c: '#4de3ff', curve, life: 9, delay: 0.25 * c.teleMul
      }));
    }
  }

  /** Pluie : du vrai spam, réservé à Hard et au-dessus. */
  function rain(c) {
    const waves = Math.round(U.lerp(5, 16, U.clamp(c.I / 6, 0, 1)));
    const per = Math.max(2, Math.round(c.cnt(5)));
    for (let w = 0; w < waves; w++) {
      c.sched(w * 0.13, () => {
        for (let i = 0; i < per; i++) {
          const a = U.rr(0, U.TAU);
          const from = edgePoint(c, a, -10);
          const to = U.rr(0, U.TAU), d = U.rr(0, c.arena.radius * 0.8);
          const tx = c.arena.cx + Math.cos(to) * d, ty = c.arena.cy + Math.sin(to) * d;
          const ang = Math.atan2(ty - from.y, tx - from.x);
          const sp = c.spd(U.rr(200, 320));
          push(c, new E.Bullet({
            x: from.x, y: from.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            r: 5.5, c: '#9aa6ff', delay: 0.12 * c.teleMul
          }));
        }
      });
    }
  }

  /* ========================================================================
     TIER 3 — densité structurée
     ===================================================================== */

  /** Grille mouvante : les trous existent, mais ils se déplacent. */
  function lattice(c) {
    const cols = Math.round(U.lerp(9, 17, U.clamp(c.I / 6, 0, 1)));
    const rows = Math.round(U.lerp(3, 7, U.clamp(c.I / 6, 0, 1)));
    const a = U.rr(0, U.TAU);
    const nx = Math.cos(a), ny = Math.sin(a);
    const tx = -ny, ty = nx;
    const span = c.arena.radius * 2.1;
    const sp = c.spd(215);
    const org = { x: c.arena.cx - nx * (c.arena.radius + 80), y: c.arena.cy - ny * (c.arena.radius + 80) };

    for (let r = 0; r < rows; r++) {
      c.sched(r * 0.42, () => {
        const hole = U.ri(0, cols - 1);
        const hole2 = c.I > 4 ? -1 : U.ri(0, cols - 1);
        for (let i = 0; i < cols; i++) {
          if (i === hole || i === hole2) continue;
          const off = (i / (cols - 1) - 0.5) * span;
          push(c, new E.Bullet({
            x: org.x + tx * off, y: org.y + ty * off,
            vx: nx * sp, vy: ny * sp, r: 6, c: '#b48cff', delay: 0.18 * c.teleMul
          }));
        }
      });
    }
  }

  /** Tenaille : deux murs convergents, une seule fenêtre de sortie. */
  function pincer(c) {
    const a = U.rr(0, U.TAU);
    const gapHalf = U.lerp(70, 38, U.clamp(c.I / 6, 0, 1));
    const gap = U.rr(-120, 120);
    for (const dir of [a, a + Math.PI]) {
      const start = edgePoint(c, dir + Math.PI, 80);
      push(c, new E.Wall({
        x: start.x, y: start.y, a: dir,
        speed: c.spd(145), half: c.arena.radius + 200,
        gap, gapHalf, thick: 16, tele: 0.7 * c.teleMul,
        life: (c.arena.radius * 2.2) / c.spd(145), c: '#a78bfa'
      }));
    }
  }

  /** Tapis d'explosions : une ligne de bombes qui balaie l'arène. */
  function carpet(c) {
    const A = c.diff.aoe;
    const steps = Math.round(U.lerp(5, 12, U.clamp(c.I / 6, 0, 1)));
    const a = U.rr(0, U.TAU);
    const nx = Math.cos(a), ny = Math.sin(a);
    const linger = A.linger + A.lingerGrowth * c.I;
    const tele = Math.max(0.14, A.telegraph * 0.85 * c.sonarMul);
    for (let i = 0; i < steps; i++) {
      c.sched(i * 0.16, () => {
        const t = (i / (steps - 1) - 0.5) * c.arena.radius * 1.9;
        push(c, new E.Blast({
          x: c.arena.cx + nx * t + U.rr(-40, 40),
          y: c.arena.cy + ny * t + U.rr(-40, 40),
          r: A.radius * 0.8, tele, linger: linger * 0.75,
          secondary: 0, c: '#ff8a3d'
        }));
      });
    }
  }

  /* ========================================================================
     TIER 4-5 — inhumain
     ===================================================================== */

  /** Visée prédictive parfaite, salves rapprochées. Aucun temps de lecture. */
  function predictor(c) {
    const shots = Math.round(U.lerp(6, 16, U.clamp(c.I / 8, 0, 1)));
    const sp = c.spd(340);
    for (let i = 0; i < shots; i++) {
      c.sched(i * 0.09, () => {
        const from = edgePoint(c, U.rr(0, U.TAU), -20);
        const a = lead(c, from.x, from.y, sp, c.aimError);
        push(c, new E.Bullet({
          x: from.x, y: from.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 7, c: '#ff3b6b', delay: 0.07
        }));
      });
    }
  }

  /** Floraison : deux couches contrarotatives, les couloirs se referment. */
  function blossom(c) {
    const layers = 3;
    const n = Math.round(c.cnt(30));
    for (let L = 0; L < layers; L++) {
      c.sched(L * 0.22, () => {
        const sp = c.spd(130 + L * 55);
        const off = L * 0.25;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * U.TAU + off;
          push(c, new E.Bullet({
            x: c.arena.cx + Math.cos(a) * HUB, y: c.arena.cy + Math.sin(a) * HUB,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            r: 6, c: L % 2 ? '#ff3b6b' : '#4de3ff',
            curve: (L % 2 ? 1 : -1) * 0.55, life: 9
          }));
        }
      });
    }
  }

  /** Faisceau traqueur : il faut changer de direction en continu. */
  function hunterBeam(c) {
    const from = edgePoint(c, U.rr(0, U.TAU), -10);
    const l = new E.Laser({
      x: from.x, y: from.y,
      a: Math.atan2(c.player.y - from.y, c.player.x - from.x),
      w: 22, tele: 0.3, active: 4.5, spin: 0, c: '#ff3b6b'
    });
    const g = c.game;
    const base = l.update;
    l.update = function (dt, game) {
      const want = Math.atan2(game.player.y - this.y, game.player.x - this.x);
      this.a += U.clamp(U.angDelta(this.a, want), -2.4 * dt, 2.4 * dt);
      return base.call(this, dt, game);
    };
    g.hazards.push(l);
  }

  /** Singularité : presque toute l'arène explose, quelques îlots survivent. */
  function singularity(c) {
    const A = c.diff.aoe;
    const linger = (A.linger + A.lingerGrowth * c.I) * 1.3;
    const tele = Math.max(0.16, A.telegraph * 1.2 * c.sonarMul);
    const R = c.arena.radius;
    const rings = 3;
    for (let ring = 0; ring < rings; ring++) {
      const rad = R * (0.3 + ring * 0.32);
      const n = 5 + ring * 4;
      const off = U.rr(0, U.TAU);
      for (let i = 0; i < n; i++) {
        const a = off + (i / n) * U.TAU;
        c.sched(ring * 0.12, () => {
          push(c, new E.Blast({
            x: c.arena.cx + Math.cos(a) * rad,
            y: c.arena.cy + Math.sin(a) * rad,
            r: A.radius * 0.75, tele, linger,
            secondary: 0, c: '#ff3b6b'
          }));
        });
      }
    }
  }

  /* ========================================================================
     Registre
     ===================================================================== */
  const PATTERNS = [
    { id: 'ring',    name: 'Anneau',      tier: 0, w: { skill: 1.0, spam: 0.1, brutal: 0 }, run: ringBurst },
    { id: 'aimed',   name: 'Salve visée', tier: 0, w: { skill: 1.0, spam: 0.2, brutal: 0.2 }, run: aimedVolley },
    { id: 'bomb',    name: 'Grosses boules', tier: 0, w: { skill: 0.9, spam: 0.5, brutal: 0.6 }, run: bombCluster },
    { id: 'sweep',   name: 'Balayage',    tier: 1, w: { skill: 1.0, spam: 0.1, brutal: 0.1 }, run: laserSweep },
    { id: 'star',    name: 'Étoile',      tier: 1, w: { skill: 1.0, spam: 0.2, brutal: 0.1 }, run: laserStar },
    { id: 'wall',    name: 'Mur',         tier: 1, w: { skill: 1.0, spam: 0.1, brutal: 0.1 }, run: wallGap },
    { id: 'chase',   name: 'Traqueuses',  tier: 1, w: { skill: 0.9, spam: 0.3, brutal: 0.3 }, run: chasers },
    { id: 'spiral',  name: 'Spirale',     tier: 2, w: { skill: 0.8, spam: 0.7, brutal: 0.2 }, run: spiral },
    { id: 'vortex',  name: 'Vortex',      tier: 2, w: { skill: 0.9, spam: 0.5, brutal: 0.2 }, run: vortex },
    { id: 'rain',    name: 'Pluie',       tier: 2, w: { skill: 0.1, spam: 1.0, brutal: 0.4 }, run: rain },
    { id: 'lattice', name: 'Grille',      tier: 3, w: { skill: 0.5, spam: 1.0, brutal: 0.5 }, run: lattice },
    { id: 'pincer',  name: 'Tenaille',    tier: 3, w: { skill: 0.9, spam: 0.4, brutal: 0.5 }, run: pincer },
    { id: 'carpet',  name: 'Tapis',       tier: 3, w: { skill: 0.4, spam: 0.9, brutal: 0.8 }, run: carpet },
    { id: 'predict', name: 'Prédicteur',  tier: 4, w: { skill: 0.2, spam: 0.6, brutal: 1.0 }, run: predictor },
    { id: 'blossom', name: 'Floraison',   tier: 4, w: { skill: 0.3, spam: 1.0, brutal: 0.9 }, run: blossom },
    { id: 'hunter',  name: 'Traqueur',    tier: 5, w: { skill: 0.2, spam: 0.3, brutal: 1.0 }, run: hunterBeam },
    { id: 'singu',   name: 'Singularité', tier: 5, w: { skill: 0.1, spam: 0.8, brutal: 1.0 }, run: singularity }
  ];

  root.Patterns = { PATTERNS, lead, edgePoint };
})(window);
</script>
<script>
/* ==== js/director.js ==== */
/* ==========================================================================
   director.js — chef d'orchestre
   --------------------------------------------------------------------------
   · Fait monter l'intensité en continu (difficulté progressive).
   · Choisit les patterns par tirage pondéré selon le profil de difficulté.
   · Déclenche les salves de « grosses boules » sur leur propre horloge.
   · Envoie les vagues de punition quand le joueur rate un objectif.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, P = root.Patterns;

  function Director(game) {
    this.game = game;
    this.reset(game.diff);
  }

  Director.prototype.reset = function (diff) {
    this.diff = diff;
    this.I = 1;                       // intensité courante
    this.bonus = 0;                   // surcroît durable infligé par les punitions
    // Sursis d'ouverture : on laisse le temps de lire l'arène avant le premier
    // pattern. Il se raccourcit avec la difficulté, et n'existe presque pas en
    // infernal.
    this.next = Math.max(0.9, diff.spawnBase * 0.85);
    this.nextBomb = diff.id === 'infernal' ? 2.5 : 7;
    this.lastId = null;
    this.recent = [];
    this.count = 0;
    this.surge = 0;                   // multiplicateur temporaire (punition)
    this.surgeT = 0;
  };

  /** Palier de patterns débloqué : la variété arrive progressivement. */
  Director.prototype.tier = function () {
    const t = Math.floor(U.inv(1, this.diff.intensityCap, this.I) * (this.diff.maxTier + 1));
    return U.clamp(t, 0, this.diff.maxTier);
  };

  /** Contexte passé aux patterns : tout y est déjà mis à l'échelle. */
  Director.prototype.ctx = function () {
    const g = this.game, d = this.diff, I = this.I;
    const scale = 0.55 + I * 0.28;
    return {
      game: g, diff: d, player: g.player, arena: g.arena, I,
      teleMul: d.telegraphMul * (g.player.has('sonar') ? 1.35 : 1) / Math.max(0.6, 0.85 + I * 0.06),
      sonarMul: (g.player.has('sonar') ? 1.35 : 1) * (1 / Math.max(0.7, 0.9 + I * 0.05)),
      aimError: d.id === 'infernal' ? 0 : U.lerp(0.22, 0.04, U.clamp(I / 5, 0, 1)),
      spd: base => base * d.speedMul * (1 + I * 0.045),
      cnt: base => Math.max(1, base * d.countMul * U.clamp(scale, 0.5, 2.6)),
      sched: (t, fn) => g.schedule(t, fn)
    };
  };

  Director.prototype.pickPattern = function () {
    const tier = this.tier();
    const W = this.diff.tagWeights;
    const pool = P.PATTERNS.filter(p => p.tier <= tier);
    return U.weighted(pool, p => {
      let w = p.w.skill * W.skill + p.w.spam * W.spam + p.w.brutal * W.brutal;
      // Anti-répétition : on ne veut pas trois fois le même pattern d'affilée.
      if (p.id === this.lastId) w *= 0.15;
      else if (this.recent.indexOf(p.id) >= 0) w *= 0.45;
      // Les patterns récents (haut tier) sont légèrement favorisés : la montée
      // en difficulté doit se *voir*, pas seulement s'accélérer.
      if (p.tier === tier && tier > 0) w *= 1.35;
      return w;
    });
  };

  Director.prototype.fire = function (pat) {
    pat.run(this.ctx());
    this.lastId = pat.id;
    this.recent.push(pat.id);
    if (this.recent.length > 3) this.recent.shift();
    this.count++;
    this.game.lastPattern = pat.name;
    this.game.lastPatternT = 1.8;
  };

  /** Vague de punition : réponse immédiate à un objectif raté. */
  Director.prototype.punish = function (severity) {
    const g = this.game;
    g.fx.blink('#ff3b30', 0.42);
    g.fx.kick(14);
    g.audio.fail();
    const c = this.ctx();
    const tier = this.tier();
    const pool = P.PATTERNS.filter(p => p.tier <= Math.min(this.diff.maxTier, tier + 1));
    const n = 2 + Math.round(severity);
    for (let i = 0; i < n; i++) {
      const pat = U.pick(pool);
      g.schedule(i * 0.28, () => pat.run(this.ctx()));
    }
    // Et un surcroît d'intensité temporaire : la sanction se ressent dans le temps.
    this.surge = 1 + 0.5 * severity;
    this.surgeT = 6;
    // Stocké à part : écrit dans this.I, il était écrasé dès la frame suivante
    // par le recalcul de la rampe, et la punition ne coûtait donc rien.
    this.bonus += 0.35 * severity;
  };

  Director.prototype.update = function (dt, elapsed) {
    const d = this.diff;

    // --- Intensité : montée continue, jamais de palier de repos ------------
    if (this.bonus > 0) this.bonus = Math.max(0, this.bonus - dt * 0.03);
    this.I = Math.min(d.intensityCap, 1 + elapsed * d.intensityRate + this.bonus);

    if (this.surgeT > 0) {
      this.surgeT -= dt;
      if (this.surgeT <= 0) this.surge = 0;
    }
    const rate = this.I * (1 + (this.surge || 0));

    // --- Patterns ----------------------------------------------------------
    this.next -= dt;
    if (this.next <= 0) {
      const interval = Math.max(d.spawnFloor, d.spawnBase / rate);
      this.next = interval * U.rr(0.82, 1.18);
      this.fire(this.pickPattern());

      // À haute intensité, les patterns se superposent volontairement.
      const overlap = U.clamp((this.I - d.intensityCap * 0.45) / d.intensityCap, 0, 1);
      if (U.chance(overlap * (d.tagWeights.spam > 0.5 ? 0.85 : 0.25))) {
        this.game.schedule(interval * 0.45, () => this.fire(this.pickPattern()));
      }
    }

    // --- Grosses boules : horloge séparée, elles ne ratent jamais leur tour -
    this.nextBomb -= dt;
    if (this.nextBomb <= 0) {
      const base = U.lerp(9.5, 3.2, U.clamp(this.I / d.intensityCap, 0, 1));
      this.nextBomb = Math.max(1.1, base / (d.tagWeights.brutal > 1 ? 1.8 : 1)) * U.rr(0.85, 1.15);
      const bomb = P.PATTERNS.find(p => p.id === 'bomb');
      this.fire(bomb);
    }
  };

  root.Director = Director;
})(window);
</script>
<script>
/* ==== js/objectives.js ==== */
/* ==========================================================================
   objectives.js — la boucle punition / récompense
   --------------------------------------------------------------------------
   Deux types d'objectifs :
     · survive   : atteindre un temps -> buff offert.
     · challenge : une fenêtre avec une condition (frôler N fois, ne pas
                   dasher, rester au centre). Réussite -> buff. Échec ->
                   vague de punition immédiate + jauge d'adrénaline vidée.
   Le contrat est volontairement dur : un buff se mérite, et rater une
   fenêtre coûte tout de suite, pas plus tard.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG;

  function Objectives(game) {
    this.game = game;
    this.reset(game.diff);
  }

  Objectives.prototype.reset = function (diff) {
    this.list = diff.objectives.map(o => Object.assign({}, o, { done: false, failed: false }));
    this.index = 0;
    this.activeChallenge = null;
    this.completed = 0;
    this.failed = 0;
    this.banner = null;
    this.bannerT = 0;
  };

  Objectives.prototype.say = function (text, sub, color) {
    this.banner = { text, sub, color: color || '#4de3ff' };
    this.bannerT = 2.6;
  };

  Objectives.prototype.next = function () {
    return this.list[this.index] || null;
  };

  Objectives.prototype.award = function (o) {
    const p = this.game.player;
    const buff = CFG.BUFFS[o.reward];
    p.grant(o.reward);
    o.done = true;
    this.completed++;
    this.game.fx.blink('#4de3ff', 0.22);
    this.game.fx.text(p.x, p.y - 42, '+ ' + buff.name, '#ffd166', 19);
    this.game.fx.burst(p.x, p.y, 34, '#ffd166', 300, 3.4, 0.8);
    this.game.audio.reward();
    this.say(buff.name.toUpperCase() + ' DÉBLOQUÉ', buff.desc, '#ffd166');
  };

  Objectives.prototype.failChallenge = function (o, why) {
    o.failed = true;
    this.failed++;
    const p = this.game.player;
    p.adrenalin = 0;
    this.game.fx.text(p.x, p.y - 42, 'ÉCHEC', '#ff3b30', 22);
    this.say('OBJECTIF RATÉ', why + ' — vague de punition.', '#ff3b30');
    // Sévérité : plus on est loin dans la série, plus ça coûte cher.
    this.game.director.punish(1 + Math.min(2, this.completed * 0.4));
  };

  Objectives.prototype.update = function (dt, elapsed) {
    if (this.bannerT > 0) this.bannerT -= dt;

    const ch = this.activeChallenge;
    if (ch) {
      ch.left -= dt;

      if (ch.cond === 'inner') {
        const a = this.game.arena;
        const inside = U.dist(this.game.player.x, this.game.player.y, a.cx, a.cy) < a.innerRadius();
        if (!inside) {
          ch.outT = (ch.outT || 0) + dt;
          if (ch.outT > 0.35) {                      // tolérance minime
            this.activeChallenge = null;
            this.failChallenge(ch.src, 'Sorti du cercle intérieur');
            this.index++;
            return;
          }
        } else ch.outT = 0;
      }

      if (ch.cond === 'nodash' && this.game.player.dashedSince(ch.startedAt)) {
        this.activeChallenge = null;
        this.failChallenge(ch.src, 'Dash utilisé');
        this.index++;
        return;
      }

      if (ch.cond === 'graze') {
        ch.progress = this.game.stats.graze - ch.baseGraze;
        if (ch.progress >= ch.target) {
          this.activeChallenge = null;
          this.award(ch.src);
          this.index++;
          return;
        }
      }

      if (ch.left <= 0) {
        this.activeChallenge = null;
        if (ch.cond === 'graze') {
          this.failChallenge(ch.src, 'Frôlements insuffisants (' + ch.progress + '/' + ch.target + ')');
        } else {
          this.award(ch.src);                        // tenu jusqu'au bout
        }
        this.index++;
        return;
      }
      return;                                        // un challenge à la fois
    }

    const o = this.next();
    if (!o || elapsed < o.t) return;

    if (o.type === 'survive') {
      this.award(o);
      this.index++;
    } else {
      this.activeChallenge = {
        src: o, cond: o.cond, target: o.target || 0,
        left: o.duration, max: o.duration,
        baseGraze: this.game.stats.graze,
        startedAt: this.game.elapsed,
        progress: 0, outT: 0,
        label: o.label
      };
      this.game.fx.blink('#ffd166', 0.18);
      this.game.audio.challenge();
      this.say('DÉFI : ' + o.label, 'Réussite → ' + CFG.BUFFS[o.reward].name + ' · Échec → punition', '#ffd166');
    }
  };

  root.Objectives = Objectives;
})(window);
</script>
<script>
/* ==== js/player.js ==== */
/* ==========================================================================
   player.js — le joueur n'a AUCUNE attaque.
   --------------------------------------------------------------------------
   Tout son vocabulaire est défensif : se déplacer, dasher, ralentir pour
   viser son placement, frôler pour charger l'adrénaline. Chaque outil est
   verrouillé au départ et se gagne via les objectifs.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG, P = CFG.PLAYER;

  function Player(game) {
    this.game = game;
    this.reset();
  }

  Player.prototype.reset = function () {
    this.x = this.game.arena.cx;
    this.y = this.game.arena.cy;
    this.vx = 0; this.vy = 0;
    this.face = -Math.PI / 2;

    this.buffs = Object.create(null);
    this.dashMax = 1;
    this.dashCharges = 0;
    this.dashCd = 0;
    this.dashing = 0;
    this.iframes = 0;
    this.lastDashAt = -99;

    this.focus = false;
    this.adrenalin = 0;            // 0..1, se remplit en frôlant
    this.slowT = 0;
    this.wind = 0;                 // charges de « second souffle »

    this.outOfBounds = false;
    this.outRatio = 0;
    this.alive = true;
    this.grazeCd = new WeakMap();
    this.speedMul = 1;
    this.sludge = false;
    this.trailT = 0;
  };

  Player.prototype.has = function (id) { return !!this.buffs[id]; };

  Player.prototype.grant = function (id) {
    this.buffs[id] = true;
    if (id === 'dash') { this.dashMax = Math.max(this.dashMax, 1); this.dashCharges = this.dashMax; }
    if (id === 'dash2') { this.dashMax = 2; this.dashCharges = this.dashMax; }
    if (id === 'dash3') { this.dashMax = 3; this.dashCharges = this.dashMax; }
    if (id === 'wind') this.wind += 1;
    if (id === 'swift') this.speedMul *= 1.12;
  };

  Player.prototype.dashedSince = function (t) { return this.lastDashAt > t; };

  Player.prototype.grazeRadius = function () {
    return this.has('magnet') ? P.grazeRadiusMagnet : P.grazeRadius;
  };

  Player.prototype.iframeDuration = function () {
    const base = this.game.diff.dashIFrames;
    return this.has('phase') ? base * 2.1 + 0.08 : base;
  };

  /* --- Mise à jour -------------------------------------------------------- */
  Player.prototype.update = function (dt, input) {
    const d = this.game.diff;

    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.dashCd <= 0 && this.dashCharges < this.dashMax && this.has('dash')) {
      this.dashCharges++;
      if (this.dashCharges < this.dashMax) this.dashCd = d.dashCooldown;
    }
    if (this.iframes > 0) this.iframes -= dt;
    if (this.slowT > 0) this.slowT -= dt;

    // --- Focus : lent et précis. Le hitbox devient visible. ---------------
    this.focus = this.has('focus') && input.held('focus');

    // --- Dash -------------------------------------------------------------
    if (this.dashing > 0) {
      this.dashing -= dt;
      this.x += Math.cos(this.face) * P.dashSpeed * dt;
      this.y += Math.sin(this.face) * P.dashSpeed * dt;
      this.trailT -= dt;
      if (this.trailT <= 0) {
        this.trailT = 0.012;
        this.game.fx.trail(this.x, this.y, '#4de3ff', 4.5);
      }
    } else {
      const ax = input.axis();
      if (ax.x || ax.y) this.face = Math.atan2(ax.y, ax.x);

      let speed = d.playerSpeed * this.speedMul;
      if (this.focus) speed *= P.focusMul;
      if (this.sludge) speed *= 0.62;

      const tvx = ax.x * speed, tvy = ax.y * speed;
      const acc = (ax.x || ax.y) ? P.accel : P.friction;
      this.vx = U.approach(this.vx, tvx, acc * dt);
      this.vy = U.approach(this.vy, tvy, acc * dt);
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      if (this.has('dash') && this.dashCharges > 0 && input.tapped('dash')) {
        this.dashCharges--;
        if (this.dashCd <= 0) this.dashCd = d.dashCooldown;
        this.dashing = P.dashTime;
        this.iframes = this.iframeDuration();
        this.lastDashAt = this.game.elapsed;
        this.game.stats.dashes++;
        this.vx = Math.cos(this.face) * P.dashSpeed * 0.45;
        this.vy = Math.sin(this.face) * P.dashSpeed * 0.45;
        this.game.fx.ring(this.x, this.y, 14, 10, '#4de3ff', 200);
        this.game.audio.dash();
      }
    }

    // --- Adrénaline : ralentir le temps, payé en frôlements ----------------
    if (this.has('adrenalin') && this.adrenalin >= P.adrenalinCost && input.tapped('adren')) {
      this.adrenalin = 0;
      this.slowT = P.adrenalinDuration;
      this.game.fx.blink('#4de3ff', 0.2);
      this.game.fx.ring(this.x, this.y, 26, 18, '#4de3ff', 340);
      this.game.audio.slow();
      this.game.stats.adrenUses++;
    }

    // --- Terrain de la carte infinie --------------------------------------
    this.sludge = false;
    if (this.game.arena.endless) {
      const sl = this.game.arena.featureAt(this.x, this.y, 'sludge');
      if (sl) this.sludge = true;
      const ch = this.game.arena.featureAt(this.x, this.y, 'charge');
      if (ch && ch.used <= 0 && this.has('dash') && this.dashCharges < this.dashMax) {
        ch.used = 14;                                 // se recharge lentement
        this.dashCharges = this.dashMax;
        this.game.fx.text(this.x, this.y - 30, 'DASH RECHARGÉ', '#ffd166', 14);
        this.game.audio.pickup();
      }
      // Les piliers sont solides : on ne les traverse pas.
      const pil = this.game.arena.featureAt(this.x, this.y, 'pillar');
      if (pil) {
        const a = Math.atan2(this.y - pil.y, this.x - pil.x);
        this.x = pil.x + Math.cos(a) * (pil.r + P.hitbox);
        this.y = pil.y + Math.sin(a) * (pil.r + P.hitbox);
        if (this.dashing > 0) this.dashing = 0;
      }
      for (const f of this.game.arena.nearby) if (f.used > 0) f.used -= dt;
    }
  };

  /** Frôlement : récompense le jeu près des balles, punit la fuite. */
  Player.prototype.checkGraze = function (haz, dt) {
    const gr = this.grazeRadius();
    const d = haz.edge(this.x, this.y);
    if (d < 0 || d > gr) return;
    const until = this.grazeCd.get(haz) || 0;
    if (this.game.elapsed < until) return;
    this.grazeCd.set(haz, this.game.elapsed + CFG.PLAYER.grazeCooldown);

    this.game.stats.graze++;
    this.adrenalin = Math.min(1, this.adrenalin + 0.055);
    this.game.fx.spawn(this.x + U.rr(-6, 6), this.y + U.rr(-6, 6),
      U.rr(-40, 40), U.rr(-70, -20), 0.4, 2.2, '#4de3ff', 2, false);
    if (this.game.stats.graze % 10 === 0) this.game.audio.graze();
  };

  /** Encaisse : le second souffle sauve une fois, mais le prix est immédiat. */
  Player.prototype.tryAbsorb = function () {
    if (this.wind <= 0) return false;
    this.wind--;
    this.iframes = 1.1;
    this.adrenalin = 0;
    this.game.fx.blink('#ffd166', 0.6);
    this.game.fx.kick(20);
    this.game.fx.text(this.x, this.y - 46, 'SECOND SOUFFLE', '#ffd166', 20);
    this.game.audio.save();
    this.game.director.punish(2);
    return true;
  };

  /* --- Rendu -------------------------------------------------------------- */
  Player.prototype.draw = function (ctx) {
    const invuln = this.iframes > 0;
    const c = invuln ? '#ffd166' : '#4de3ff';

    // Rayon de frôlement : uniquement en focus, pour ne pas polluer l'écran.
