    if (this.focus) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(77,227,255,.22)';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.grazeRadius(), 0, U.TAU); ctx.stroke();
    }

    U.glow(ctx, this.x, this.y, 30, U.rgba(c, invuln ? 0.42 : 0.26), U.rgba(c, 0));

    // Coque
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.face);
    ctx.fillStyle = U.rgba(c, this.focus ? 0.45 : 0.85);
    ctx.beginPath();
    ctx.moveTo(P.visual, 0);
    ctx.lineTo(-P.visual * 0.7, -P.visual * 0.72);
    ctx.lineTo(-P.visual * 0.35, 0);
    ctx.lineTo(-P.visual * 0.7, P.visual * 0.72);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Le vrai hitbox — minuscule, toujours affiché : aucune mort inexpliquée.
    ctx.fillStyle = invuln ? '#ffd166' : '#ffffff';
    ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox, 0, U.TAU); ctx.fill();
    if (this.focus) {
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#ff4d7a';
      ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox + 3, 0, U.TAU); ctx.stroke();
    }
  };

  root.Player = Player;
})(window);
</script>
<script>
/* ==== js/hud.js ==== */
/* ==========================================================================
   hud.js — interface en jeu (dessinée en espace écran)
   Lisibilité d'abord : rien ne doit masquer une trajectoire.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG;

  function bar(ctx, x, y, w, h, k, col, bg) {
    ctx.fillStyle = bg || 'rgba(255,255,255,.10)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w * U.clamp(k, 0, 1), h);
  }

  function label(ctx, x, y, text, size, col, align) {
    ctx.font = '700 ' + size + 'px Segoe UI, Inter, sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
  }

  function draw(ctx, g, w, h) {
    const p = g.player, d = g.diff, o = g.objectives;
    // Sous cette largeur, le HUD se replie : le chrono rétrécit, les colonnes
    // latérales disparaissent et les objets remontent en haut à gauche.
    const compact = w < 820;
    ctx.save();

    /* ---- Chrono + difficulté (haut gauche) ---------------------------- */
    // Signature : présente en jeu dans les deux modes, jamais tapageuse.
    // Sous 820 px elle percuterait le titre d'objectif centré, et la marque
    // figure déjà sur le menu, la pause et l'écran de fin.
    if (!compact) label(ctx, 22, 24, 'DODGE TRAINER', 10, 'rgba(200,210,240,.34)');
    label(ctx, 22, compact ? 56 : 64, U.fmtTime(g.elapsed), compact ? 26 : 38, '#fff');
    label(ctx, 22, 84, 'BULLET-HELL · ' + d.name + (g.arena.endless ? ' · CARTE INFINIE' : ''), 11.5, d.color);

    // Intensité : montre que la difficulté monte en permanence.
    const ik = U.inv(1, d.intensityCap, g.director.I);
    bar(ctx, 22, 94, 168, 5, ik, d.color);
    label(ctx, 196, 99, 'INTENSITÉ ×' + g.director.I.toFixed(2), 10.5, 'rgba(200,210,240,.72)');

    /* ---- Record (haut droite) ------------------------------------------ */
    if (g.best > 0) {
      label(ctx, w - 22, 36, 'RECORD', 10.5, 'rgba(200,210,240,.55)', 'right');
      const beating = g.elapsed > g.best;
      label(ctx, w - 22, 60, U.fmtTime(g.best), 22, beating ? '#4ade80' : '#ffd166', 'right');
      if (beating) label(ctx, w - 22, 78, 'NOUVEAU RECORD', 10.5, '#4ade80', 'right');
    }

    /* ---- Objectif courant (haut centre) -------------------------------- */
    const ch = o.activeChallenge;
    if (ch) {
      const k = ch.left / ch.max;
      const bw = 300;
      ctx.fillStyle = 'rgba(8,10,20,.72)';
      ctx.fillRect(w / 2 - bw / 2, 16, bw, 46);
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(w / 2 - bw / 2, 16, bw, 46);
      label(ctx, w / 2, 36, 'DÉFI · ' + ch.label, 12.5, '#ffd166', 'center');
      bar(ctx, w / 2 - bw / 2 + 12, 44, bw - 24, 6, k, k < 0.3 ? '#ff3b30' : '#ffd166');
      if (ch.cond === 'graze') {
        label(ctx, w / 2, 58, ch.progress + ' / ' + ch.target + ' frôlements', 11, '#fff', 'center');
      } else {
        label(ctx, w / 2, 58, ch.left.toFixed(1) + ' s restantes', 11, '#fff', 'center');
      }
    } else {
      const nx = o.next();
      if (nx) {
        const remain = Math.max(0, nx.t - g.elapsed);
        label(ctx, w / 2, 32, 'PROCHAIN OBJECTIF · ' + nx.label, 12, 'rgba(200,210,240,.75)', 'center');
        label(ctx, w / 2, 50, 'dans ' + remain.toFixed(1) + 's  →  ' + CFG.BUFFS[nx.reward].name,
          11, d.color, 'center');
      } else {
        label(ctx, w / 2, 36, 'TOUS LES OBJECTIFS VALIDÉS · SURVIE PURE', 12, '#4ade80', 'center');
      }
    }

    /* ---- Bannière d'annonce -------------------------------------------- */
    if (o.bannerT > 0 && o.banner) {
      const a = U.clamp(o.bannerT / 0.5, 0, 1);
      ctx.globalAlpha = a;
      label(ctx, w / 2, h * 0.30, o.banner.text, 30, o.banner.color, 'center');
      if (o.banner.sub) label(ctx, w / 2, h * 0.30 + 24, o.banner.sub, 13, 'rgba(230,236,255,.8)', 'center');
      ctx.globalAlpha = 1;
    }

    /* ---- Pattern en cours (info d'apprentissage) ----------------------- */
    if (!compact && g.lastPatternT > 0 && g.lastPattern) {
      ctx.globalAlpha = U.clamp(g.lastPatternT / 0.6, 0, 1) * 0.75;
      label(ctx, w - 22, h - 20, g.lastPattern.toUpperCase(), 12, 'rgba(200,210,240,.9)', 'right');
      ctx.globalAlpha = 1;
    }

    /* ---- Dash / adrénaline (bas centre) --------------------------------
       Rythme mesuré depuis une marge basse : l'ancienne version plaçait la
       ligne d'adrénaline à y = h, donc coupée par le bord de l'écran.       */
    const baseY = h - 18;          // dernière ligne de texte
    const cy = baseY - 34;         // rangée des charges de dash
    if (p.has('dash')) {
      const n = p.dashMax;
      const sw = 34, gap = 7;
      const total = n * sw + (n - 1) * gap;
      for (let i = 0; i < n; i++) {
        const x = w / 2 - total / 2 + i * (sw + gap);
        const full = i < p.dashCharges;
        ctx.fillStyle = full ? '#4de3ff' : 'rgba(255,255,255,.12)';
        ctx.fillRect(x, cy, sw, 7);
        if (!full && i === p.dashCharges && p.dashCd > 0) {
          const k = 1 - p.dashCd / d.dashCooldown;
          ctx.fillStyle = 'rgba(77,227,255,.45)';
          ctx.fillRect(x, cy, sw * k, 7);
        }
      }
      label(ctx, w / 2, cy - 8, 'DASH', 10, 'rgba(200,210,240,.6)', 'center');
    }

    if (p.has('adrenalin')) {
      const bw2 = compact ? Math.min(190, w - 60) : 190;
      const ready = p.adrenalin >= 1;
      bar(ctx, w / 2 - bw2 / 2, baseY - 16, bw2, 6, p.adrenalin, ready ? '#ffd166' : '#7b8cff');
      label(ctx, w / 2, baseY,
        ready ? 'ADRÉNALINE PRÊTE — [E]' : 'ADRÉNALINE ' + Math.round(p.adrenalin * 100) + '%',
        10.5, ready ? '#ffd166' : 'rgba(200,210,240,.6)', 'center');
    }

    /* ---- Objets obtenus ------------------------------------------------ */
    const iw = compact ? 21 : 26, istep = compact ? 25 : 31;
    let bx = 22;
    const by = compact ? 158 : h - 34;
    for (const id in p.buffs) {
      const b = CFG.BUFFS[id];
      if (bx + iw > w - 22) break;            // jamais au-delà du bord
      ctx.fillStyle = 'rgba(255,209,102,.14)';
      ctx.fillRect(bx, by - 16, iw, 24);
      ctx.strokeStyle = 'rgba(255,209,102,.45)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by - 16, iw, 24);
      label(ctx, bx + iw / 2, by + 1, b.icon, compact ? 11 : 13, '#ffd166', 'center');
      bx += istep;
    }
    if (p.wind > 0 && !compact) {
      label(ctx, 22, by - 24, '✚ SECOND SOUFFLE ×' + p.wind, 11, '#4ade80');
    }

    /* ---- Statistiques discrètes (bas droite) --------------------------- */
    if (!compact) {
      label(ctx, w - 22, h - 40, 'FRÔLEMENTS ' + g.stats.graze, 11, 'rgba(200,210,240,.5)', 'right');
    }

    /* ---- Alerte hors limites ------------------------------------------- */
    if (p.outRatio > 0.02) {
      const k = p.outRatio;
      ctx.save();
      ctx.globalAlpha = k * 0.55;
      const grad = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.62);
      grad.addColorStop(0, 'rgba(255,59,48,0)');
      grad.addColorStop(1, 'rgba(255,59,48,1)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      if (p.outOfBounds) {
        label(ctx, w / 2, h * 0.16, 'HORS ZONE — ' + ((1 - k) * d.outOfBoundsGrace).toFixed(2) + 's',
          26, '#ff3b30', 'center');
      }
    }

    /* ---- Ralentissement actif ------------------------------------------ */
    if (p.slowT > 0) {
      ctx.strokeStyle = 'rgba(77,227,255,' + U.clamp(p.slowT, 0, 1) * 0.5 + ')';
      ctx.lineWidth = 3;
      ctx.strokeRect(2, 2, w - 4, h - 4);
      label(ctx, w / 2, h * 0.11, 'ADRÉNALINE', 16, '#4de3ff', 'center');
    }

    ctx.restore();
  }

  root.HUD = { draw };
})(window);
</script>
<script>
/* ==== js/game.js ==== */
/* ==========================================================================
   game.js — boucle, collisions, états, audio, persistance
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG;

  /* --- Audio minimal (WebAudio, aucun asset) ----------------------------- */
  function makeAudio() {
    let actx = null, master = null, muted = false;
    function ensure() {
      if (actx) return actx;
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.16;
      master.connect(actx.destination);
      return actx;
    }
    function tone(freq, dur, type, gain, sweepTo) {
      if (muted) return;
      const a = ensure();
      if (!a || a.state === 'suspended') { if (a) a.resume(); if (!a) return; }
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), a.currentTime + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.5, a.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(master);
      o.start(); o.stop(a.currentTime + dur + 0.02);
    }
    function noise(dur, gain) {
      if (muted) return;
      const a = ensure(); if (!a) return;
      const n = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource(); src.buffer = buf;
      const g = a.createGain(); g.gain.value = gain || 0.4;
      src.connect(g); g.connect(master);
      src.start();
    }
    return {
      unlock: () => { const a = ensure(); if (a && a.state === 'suspended') a.resume(); },
      boom:      () => { noise(0.34, 0.45); tone(70, 0.4, 'sine', 0.55, 28); },
      zap:       () => tone(880, 0.12, 'sawtooth', 0.22, 300),
      dash:      () => tone(520, 0.09, 'triangle', 0.26, 940),
      graze:     () => tone(1400, 0.05, 'sine', 0.13),
      reward:    () => { tone(660, 0.1, 'triangle', 0.3); setTimeout(() => tone(990, 0.16, 'triangle', 0.3), 90); },
      challenge: () => { tone(440, 0.09, 'square', 0.18); setTimeout(() => tone(560, 0.11, 'square', 0.18), 100); },
      fail:      () => { tone(160, 0.35, 'sawtooth', 0.32, 60); noise(0.2, 0.3); },
      save:      () => { tone(300, 0.2, 'triangle', 0.4, 700); noise(0.15, 0.25); },
      slow:      () => tone(300, 0.5, 'sine', 0.28, 120),
      pickup:    () => tone(1200, 0.08, 'triangle', 0.2, 1800),
      death:     () => { noise(0.6, 0.5); tone(120, 0.7, 'sawtooth', 0.4, 30); }
    };
  }

  /* --- Jeu ---------------------------------------------------------------- */
  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.state = 'menu';
    this.dpr = 1;
    this.w = 0; this.h = 0;

    this.diff = CFG.diff('medium');
    this.arena = new root.Arena(this);
    this.player = new root.Player(this);
    this.fx = new root.Fx();
    this.audio = makeAudio();
    this.hazards = [];
    this.timers = [];
    this.elapsed = 0;
    this.timeScale = 1;
    this.best = 0;
    this.lastPattern = null;
    this.lastPatternT = 0;
    this.stats = { graze: 0, dashes: 0, adrenUses: 0, close: 0 };
    this.deathCause = '';
    this.endless = false;

    this.resize();
    root.addEventListener('resize', () => this.resize());
  }

  Game.prototype.resize = function () {
    this.dpr = Math.min(root.devicePixelRatio || 1, 2);
    this.w = this.canvas.clientWidth || root.innerWidth;
    this.h = this.canvas.clientHeight || root.innerHeight;
    this.canvas.width = Math.floor(this.w * this.dpr);
    this.canvas.height = Math.floor(this.h * this.dpr);
  };

  /* --- Persistance -------------------------------------------------------- */
  Game.prototype.bestKey = function (diffId, endless) {
    return 'dodgetrainer.best.' + diffId + (endless ? '.endless' : '');
  };
  Game.prototype.loadBest = function (diffId, endless) {
    try { return parseFloat(localStorage.getItem(this.bestKey(diffId, endless))) || 0; }
    catch (e) { return 0; }
  };
  Game.prototype.saveBest = function (v) {
    try { localStorage.setItem(this.bestKey(this.diff.id, this.endless), String(v)); }
    catch (e) { /* mode privé : on continue sans record */ }
  };

  /* --- Cycle de vie -------------------------------------------------------- */
  Game.prototype.start = function (diffId, opts) {
    this.diff = CFG.diff(diffId);
    this.endless = !!(opts && opts.endless);
    this.fx.quality = (opts && opts.quality) || 'high';
    this.fx.shakeEnabled = !(opts && opts.shake === false);

    this.arena.init(this.diff, this.endless, (Math.random() * 1e9) | 0);
    this.player.reset();
    this.fx.reset();
    this.hazards.length = 0;
    this.timers.length = 0;
    this.elapsed = 0;
    this.timeScale = 1;
    this.stats = { graze: 0, dashes: 0, adrenUses: 0, close: 0 };
    this.lastPattern = null;
    this.lastPatternT = 0;
    this.deathCause = '';
    this.best = this.loadBest(this.diff.id, this.endless);

    this.director = new root.Director(this);
    this.objectives = new root.Objectives(this);
    this.objectives.say('DIFFICULTÉ ' + this.diff.name, this.diff.sub, this.diff.color);

    this.audio.unlock();
    this.state = 'playing';
    root.Input.clearAll();
  };

  Game.prototype.schedule = function (t, fn) {
    this.timers.push({ t, fn });
  };

  Game.prototype.die = function (cause) {
    if (this.state !== 'playing') return;
    this.player.alive = false;
    this.deathCause = cause;
    this.fx.blink('#ff3b30', 0.75);
    this.fx.kick(26);
    this.fx.burst(this.player.x, this.player.y, 70, '#ff4d7a', 460, 5, 1.1);
    this.fx.ring(this.player.x, this.player.y, 40, 14, '#fff', 560);
    this.audio.death();

    const record = this.elapsed > this.best;
    if (record) { this.best = this.elapsed; this.saveBest(this.elapsed); }
    this.newRecord = record;

    this.state = 'dead';
    if (this.onDeath) this.onDeath();
  };

  /* --- Mise à jour --------------------------------------------------------- */
  Game.prototype.update = function (rawDt) {
    const p = this.player;

    // Ralentissement (adrénaline) : sur le monde, pas sur le joueur.
    const worldScale = p.slowT > 0 ? CFG.PLAYER.adrenalinScale : 1;
    const dt = rawDt;                       // le joueur garde son temps plein
    const wdt = rawDt * worldScale;

    this.elapsed += dt;
    if (this.lastPatternT > 0) this.lastPatternT -= dt;

    // --- Minuteurs différés (patterns étalés dans le temps) ---------------
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const t = this.timers[i];
      t.t -= wdt;
      if (t.t <= 0) {
        this.timers.splice(i, 1);
        t.fn();
      }
    }

    p.update(dt, root.Input);

    const collapse = this.arena.update(dt, p, this.elapsed);
    if (collapse) { this.die('Effondrement de la zone — rester dehors tue.'); return; }

    this.director.update(wdt, this.elapsed);
    this.objectives.update(dt, this.elapsed);

    // --- Dangers : update + collision + frôlement -------------------------
    const hb = CFG.PLAYER.hitbox;
    const invuln = p.iframes > 0;
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const hz = this.hazards[i];
      if (!hz.update(wdt, this)) { this.hazards.splice(i, 1); continue; }
      if (!invuln && hz.hits(p.x, p.y, hb)) {
        if (!p.tryAbsorb()) {
          this.die(deathLabel(hz));
          return;
        }
      } else {
        p.checkGraze(hz, dt);
      }
    }

    // Garde-fou mémoire : au-delà, on purge les plus anciens projectiles.
    if (this.hazards.length > 1400) this.hazards.splice(0, this.hazards.length - 1400);

    this.fx.update(dt);
    this.arena.updateCamera(dt, p, this.w, this.h);
  };

  function deathLabel(hz) {
    if (hz instanceof root.Ent.Blast) return 'Pris dans une explosion — la zone reste létale jusqu\'au bout.';
    if (hz instanceof root.Ent.Laser) return 'Touché par un faisceau.';
    if (hz instanceof root.Ent.Wall) return 'Écrasé par un mur — la brèche était ailleurs.';
    if (hz instanceof root.Ent.Chaser) return 'Rattrapé par une traqueuse.';
    return 'Touché par un projectile.';
  }

  /* --- Rendu --------------------------------------------------------------- */
  Game.prototype.render = function () {
    const ctx = this.ctx, w = this.w, h = this.h;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, w, h);

    if (this.state === 'menu') { this.drawIdleBackdrop(ctx, w, h); return; }

    const camX = this.arena.camX + this.fx.shakeX;
    const camY = this.arena.camY + this.fx.shakeY;
    const ox = w / 2 - camX, oy = h / 2 - camY;

    ctx.save();
    ctx.translate(ox, oy);

    const view = { x0: camX - w / 2 - 80, y0: camY - h / 2 - 80, x1: camX + w / 2 + 80, y1: camY + h / 2 + 80 };

    this.arena.drawFloor(ctx, view);
    this.arena.drawBounds(ctx, view, this.elapsed);

    // Les dangers sont découpés sur le cercle jouable : ce qui est dehors est
    // de toute façon mortel, l'afficher ne ferait que masquer les trajectoires
    // qui comptent.
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.arena.cx, this.arena.cy, this.arena.radius + 14, 0, U.TAU);
    ctx.clip();

    // Explosions d'abord (au sol), puis le reste : jamais un projectile caché
    // sous une flaque.
    for (const hz of this.hazards) if (hz instanceof root.Ent.Blast) hz.draw(ctx, this);
    for (const hz of this.hazards) if (!(hz instanceof root.Ent.Blast)) hz.draw(ctx, this);
    ctx.restore();

    // Les particules suivent la même règle que les dangers, avec une marge :
    // la gerbe de mort reste visible même si on meurt juste au-dehors.
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.arena.cx, this.arena.cy, this.arena.radius + 90, 0, U.TAU);
    ctx.clip();
    this.fx.drawParticles(ctx);
    ctx.restore();

    if (this.player.alive) this.player.draw(ctx);
    this.fx.drawTexts(ctx);

    ctx.restore();

    this.fx.drawFlash(ctx, w, h);
    if (this.state === 'playing' || this.state === 'paused') root.HUD.draw(ctx, this, w, h);
  };

  /** Fond animé du menu : quelques orbes, zéro gameplay. */
  Game.prototype.drawIdleBackdrop = function (ctx, w, h) {
    const t = performance.now() * 0.001;
    for (let i = 0; i < 26; i++) {
      const a = t * (0.1 + (i % 5) * 0.035) + i;
      const r = 120 + (i * 37) % 340;
      const x = w / 2 + Math.cos(a) * r * 1.5;
      const y = h / 2 + Math.sin(a * 1.3) * r * 0.75;
      U.glow(ctx, x, y, 34, 'rgba(77,227,255,.10)', 'rgba(77,227,255,0)');
    }
  };

  root.Game = Game;
})(window);
</script>

<script>
/* ==== js/lol/input.js ==== */
/* ==========================================================================
   lol/input.js — souris façon LoL. Namespace séparé : ne touche pas Input.
   --------------------------------------------------------------------------
   Les coordonnées restent en ESPACE ÉCRAN ; seul le jeu connaît la caméra et
   le zoom, donc c'est lui qui convertit en unités monde.
   ========================================================================== */
(function (root) {
  'use strict';

  const down = Object.create(null);
  const pressed = Object.create(null);

  const MAP = {
    flash:   ['KeyF'],
    dash:    ['Space'],
    cleanse: ['KeyA'],
    zhonya:  ['KeyE'],
    stop:    ['KeyS']            // comme LoL : annule l'ordre de déplacement
  };

  const mouse = { sx: 0, sy: 0, inside: false };
  let moveOrder = null;
  let holdMove = false;          // clic droit maintenu = ordre régénéré en continu
  let attached = false;

  function held(a) {
    const c = MAP[a];
    if (!c) return false;
    for (let i = 0; i < c.length; i++) if (down[c[i]]) return true;
    return false;
  }

  function tapped(a) {
    const c = MAP[a];
    if (!c) return false;
    for (let i = 0; i < c.length; i++) {
      if (pressed[c[i]]) { pressed[c[i]] = false; return true; }
    }
    return false;
  }

  /** Ordre de déplacement en attente, ou null. */
  function takeMoveOrder() {
    if (moveOrder) { const m = moveOrder; moveOrder = null; return m; }
    if (holdMove && mouse.inside) return { sx: mouse.sx, sy: mouse.sy, held: true };
    return null;
  }

  function clearAll() {
    for (const k in down) down[k] = false;
    for (const k in pressed) pressed[k] = false;
    moveOrder = null;
    holdMove = false;
  }

  function attach(canvas) {
    if (attached) return;
    attached = true;

    root.addEventListener('keydown', e => {
      if (e.code === 'Space') e.preventDefault();
      if (!e.repeat) pressed[e.code] = true;
      down[e.code] = true;
    }, { passive: false });
    root.addEventListener('keyup', e => { down[e.code] = false; });
    root.addEventListener('blur', clearAll);

    // Le clic droit est une commande de jeu : pas de menu contextuel.
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      mouse.sx = e.clientX - r.left;
      mouse.sy = e.clientY - r.top;
      mouse.inside = true;
    }

    canvas.addEventListener('mousemove', pos);
    canvas.addEventListener('mouseleave', () => { mouse.inside = false; holdMove = false; });

    canvas.addEventListener('mousedown', e => {
      pos(e);
      if (e.button === 2) {
        moveOrder = { sx: mouse.sx, sy: mouse.sy };
        holdMove = true;
        e.preventDefault();
      }
    });
    root.addEventListener('mouseup', e => { if (e.button === 2) holdMove = false; });

    // Tactile : un appui vaut un clic droit.
    canvas.addEventListener('touchstart', e => {
      const t = e.changedTouches[0], r = canvas.getBoundingClientRect();
      mouse.sx = t.clientX - r.left; mouse.sy = t.clientY - r.top; mouse.inside = true;
      moveOrder = { sx: mouse.sx, sy: mouse.sy };
      holdMove = true;
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      const t = e.changedTouches[0], r = canvas.getBoundingClientRect();
      mouse.sx = t.clientX - r.left; mouse.sy = t.clientY - r.top;
      e.preventDefault();
    }, { passive: false });
    const end = () => { holdMove = false; };
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('touchcancel', end);
  }

  root.LolInput = { attach, held, tapped, takeMoveOrder, clearAll, mouse };
})(window);
</script>
<script>
/* ==== js/lol/entities.js ==== */
/* ==========================================================================
   lol/entities.js — skillshots. Le joueur n'en lance aucun.
   --------------------------------------------------------------------------
   Chaque sort suit le rythme LoL : INCANTATION (indicateur au sol, le lanceur
   corrige encore sa visée) puis VOL (temps de trajet). La fenêtre d'esquive
   réelle est la somme des deux, et c'est pendant ces deux phases qu'on juke.

   Contrat : update(dt, game) -> false pour mourir · draw(ctx)
             hits(px,py,pr) -> bool · edge(px,py) -> distance (-1 = inactif)
             effect -> ce qui est appliqué au joueur au contact
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U;

  const KILL = { kind: 'kill' };

  /* ====================== LINE SHOT ======================================
     Blitzcrank Q, Morgana Q, Ezreal Q, Thresh Q…
     `collides` : s'arrête sur le premier sbire. C'est ce qui fait du
     placement derrière un sbire une esquive à part entière.                */
  function LineShot(o) {
    this.type = 'line';
    this.x = o.x; this.y = o.y;
    this.ox = o.x; this.oy = o.y;
    this.px = o.x; this.py = o.y;
    this.a = o.a;
    this.speed = o.speed;
    this.width = o.width;
    this.range = o.range;
    this.cast = o.cast; this.castMax = o.cast;
    this.collides = o.collides !== false;
    this.effect = o.effect || KILL;
    this.c = o.c || '#ff4d7a';
    this.tell = o.tell === undefined ? 1 : o.tell;
    this.caster = o.caster || null;
    this.state = 'cast';
    this.travelled = 0;
    this.threat = true;          // compte pour les esquives « de justesse »
    this.grazed = false;
  }

  LineShot.prototype.update = function (dt, game) {
    if (this.state === 'cast') {
      this.cast -= dt;
      // Pendant l'incantation le sort suit encore la visée du lanceur : bouger
      // maintenant change là où il partira. C'est le cœur du jeu.
      if (this.caster && this.caster.alive) {
        this.ox = this.x = this.caster.x;
        this.oy = this.y = this.caster.y;
        this.a = this.caster.aim;
      }
      if (this.cast <= 0) {
        this.state = 'fly';
        this.px = this.x; this.py = this.y;
        game.audio.zap();
      }
      return true;
    }

    this.px = this.x; this.py = this.y;
    const step = this.speed * dt;
    this.x += Math.cos(this.a) * step;
    this.y += Math.sin(this.a) * step;
    this.travelled += step;

    if (this.collides) {
      const r = this.width * 0.5;
      for (const m of game.minions) {
        if (!m.alive) continue;
        if (U.distToSeg(m.x, m.y, this.px, this.py, this.x, this.y) < r + m.r) {
          m.absorb(game);
          game.fx.burst(this.x, this.y, 14, this.c, 420, 6, 0.35);
          return false;
        }
      }
    }

    if (this.travelled >= this.range) {
      game.fx.burst(this.x, this.y, 6, this.c, 200, 4, 0.25);
      return false;
    }
    return true;
  };

  LineShot.prototype.hits = function (px, py, pr) {
    if (this.state !== 'fly') return false;
    return U.distToSeg(px, py, this.px, this.py, this.x, this.y) < this.width * 0.5 + pr;
  };

  LineShot.prototype.edge = function (px, py) {
    if (this.state !== 'fly') return -1;
    return U.distToSeg(px, py, this.px, this.py, this.x, this.y) - this.width * 0.5;
  };

  LineShot.prototype.draw = function (ctx) {
    if (this.state === 'cast') {
      const k = 1 - this.cast / this.castMax;
      const a = (0.10 + k * 0.32) * this.tell;
      const ex = this.ox + Math.cos(this.a) * this.range;
      const ey = this.oy + Math.sin(this.a) * this.range;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineWidth = this.width;
      ctx.strokeStyle = U.rgba(this.c, a * 0.45);
      ctx.beginPath(); ctx.moveTo(this.ox, this.oy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.lineWidth = 5;
      ctx.strokeStyle = U.rgba(this.c, Math.min(1, a * 1.9));
      ctx.setLineDash([28, 20]);
      ctx.lineDashOffset = -performance.now() * 0.05;
      ctx.beginPath(); ctx.moveTo(this.ox, this.oy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    const tx = this.x - Math.cos(this.a) * this.width * 1.7;
    const ty = this.y - Math.sin(this.a) * this.width * 1.7;
    ctx.lineWidth = this.width;
    ctx.strokeStyle = U.rgba(this.c, 0.5);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(this.x, this.y); ctx.stroke();
    ctx.restore();

    U.glow(ctx, this.x, this.y, this.width * 1.6, U.rgba(this.c, 0.45), U.rgba(this.c, 0));
    ctx.fillStyle = this.c;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.width * 0.5, 0, U.TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.width * 0.24, 0, U.TAU); ctx.fill();

    // Un sort de contrôle doit se lire autrement qu'un sort létal.
    if (this.effect.kind !== 'kill') {
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.width * 0.72, 0, U.TAU); ctx.stroke();
    }
  };

  /* ====================== CIRCLE (zone qui atterrit) =====================
     Ziggs Q, Karthus Q, Lux E, Xerath R…                                   */
  function Circle(o) {
    this.type = 'circle';
    this.x = o.x; this.y = o.y;
    this.r = o.r;
    this.tele = o.tele; this.teleMax = o.tele;
    this.linger = o.linger; this.lingerMax = o.linger;
    this.secondary = o.secondary || 0;
    this.c = o.c || '#ff8a3d';
    this.effect = o.effect || KILL;
    this.grow = o.grow || 0;
    this.state = 'tele';
    this.threat = false;
    this.grazed = false;
  }

  Circle.prototype.update = function (dt, game) {
    if (this.state === 'tele') {
      this.tele -= dt;
      if (this.tele <= 0) {
        this.state = 'boom';
        game.fx.burst(this.x, this.y, 46, this.c, 900, 11, 0.75);
        game.fx.ring(this.x, this.y, 30, this.r * 0.35, '#fff', 1100);
        game.fx.kick(this.r * 0.020);
        game.audio.boom();
      }
      return true;
    }
    this.linger -= dt;
    if (this.grow) this.r += this.grow * dt;
    if (this.linger <= 0) {
      for (let i = 0; i < this.secondary; i++) {
        const a = U.rr(0, U.TAU), d = U.rr(this.r * 0.7, this.r * 1.5);
        game.hazards.push(new Circle({
          x: this.x + Math.cos(a) * d, y: this.y + Math.sin(a) * d,
          r: this.r * 0.62, tele: Math.max(0.16, this.teleMax * 0.55),
          linger: this.lingerMax * 0.6, secondary: 0, c: '#ff5a3d'
        }));
      }
      return false;
    }
    return true;
  };

  Circle.prototype.hits = function (px, py, pr) {
    if (this.state !== 'boom') return false;
    const rr = this.r + pr;
    return U.dist2(px, py, this.x, this.y) < rr * rr;
  };

  Circle.prototype.edge = function (px, py) {
    if (this.state !== 'boom') return -1;
    return Math.abs(U.dist(px, py, this.x, this.y) - this.r);
  };

  Circle.prototype.draw = function (ctx) {
    if (this.state === 'tele') {
      const k = 1 - this.tele / this.teleMax;
      const urgent = this.tele < 0.28;
      U.glow(ctx, this.x, this.y, this.r, U.rgba(this.c, 0.10 + k * 0.16), U.rgba(this.c, 0));
      ctx.lineWidth = 5;
      ctx.strokeStyle = U.rgba(this.c, 0.5);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();
      ctx.lineWidth = urgent ? 11 : 8;
      ctx.strokeStyle = urgent ? '#fff' : this.c;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * (1 - k * 0.82), 0, U.TAU); ctx.stroke();
      return;
    }
    // La transparence baisse, la létalité non : le liseré blanc reste franc.
    const k = this.linger / this.lingerMax;
    const a = 0.30 + k * 0.42;
    U.glow(ctx, this.x, this.y, this.r * 1.12, U.rgba('#fff2c0', a * 0.75), U.rgba(this.c, 0));
    ctx.fillStyle = U.rgba(this.c, a * 0.55);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();
  };

  /* ====================== CONE ===========================================
     Annie W, Cassiopeia R…                                                 */
  function Cone(o) {
    this.type = 'cone';
    this.x = o.x; this.y = o.y;
    this.a = o.a; this.half = o.half; this.range = o.range;
    this.cast = o.cast; this.castMax = o.cast;
    this.active = o.active; this.activeMax = o.active;
    this.effect = o.effect || KILL;
    this.c = o.c || '#c77dff';
    this.tell = o.tell === undefined ? 1 : o.tell;
    this.caster = o.caster || null;
    this.state = 'cast';
    // Pas comptabilisé comme « esquive de justesse » : edge() ne renvoie pas
    // une distance mais dedans/dehors, donc il n'y a pas de frôlement à
    // mesurer. Un cône s'évite par le placement, pas par le juke.
    this.threat = false;
    this.grazed = false;
  }

  Cone.prototype.update = function (dt, game) {
    if (this.state === 'cast') {
      this.cast -= dt;
      if (this.caster && this.caster.alive) {
        this.x = this.caster.x; this.y = this.caster.y; this.a = this.caster.aim;
      }
      if (this.cast <= 0) { this.state = 'on'; game.fx.kick(5); game.audio.zap(); }
      return true;
    }
    this.active -= dt;
    return this.active > 0;
  };

  Cone.prototype._in = function (px, py, pr) {
    const d = U.dist(px, py, this.x, this.y);
    if (d > this.range + pr) return false;
    if (d <= pr) return true;
    const ang = Math.atan2(py - this.y, px - this.x);
    const slack = Math.asin(U.clamp(pr / d, 0, 1));
    return Math.abs(U.angDelta(this.a, ang)) < this.half + slack;
  };

  Cone.prototype.hits = function (px, py, pr) { return this.state === 'on' && this._in(px, py, pr); };
  Cone.prototype.edge = function (px, py) {
    if (this.state !== 'on') return -1;
    return this._in(px, py, 0) ? 0 : 9999;
  };

  Cone.prototype.draw = function (ctx) {
    const casting = this.state === 'cast';
    const k = casting ? 1 - this.cast / this.castMax : this.active / this.activeMax;
    const a = casting ? (0.12 + k * 0.28) * this.tell : 0.30 + k * 0.40;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.arc(this.x, this.y, this.range, this.a - this.half, this.a + this.half);
    ctx.closePath();
    ctx.fillStyle = U.rgba(this.c, a * 0.5);
    ctx.fill();
    ctx.lineWidth = casting ? 4 : 7;
    ctx.strokeStyle = casting ? U.rgba(this.c, Math.min(1, a * 1.8)) : 'rgba(255,255,255,.85)';
    ctx.stroke();
    ctx.restore();
  };

  /* ====================== ZONE (sol persistant) ==========================
     Brand W, Zyra E, Rumble R — ça ne bouge pas, ça reste.                 */
  function Zone(o) {
    this.type = 'zone';
    this.x = o.x; this.y = o.y; this.r = o.r;
    this.tele = o.tele; this.teleMax = o.tele;
    this.life = o.life; this.lifeMax = o.life;
    this.effect = o.effect || KILL;
    this.c = o.c || '#ff5a3d';
    this.state = 'tele';
    this.threat = false;
    this.grazed = false;
  }

  Zone.prototype.update = function (dt) {
    if (this.state === 'tele') {
      this.tele -= dt;
      if (this.tele <= 0) this.state = 'on';
      return true;
    }
    this.life -= dt;
    return this.life > 0;
  };

  Zone.prototype.hits = function (px, py, pr) {
    if (this.state !== 'on') return false;
    const rr = this.r + pr;
    return U.dist2(px, py, this.x, this.y) < rr * rr;
  };

  Zone.prototype.edge = function (px, py) {
    if (this.state !== 'on') return -1;
    return U.dist(px, py, this.x, this.y) - this.r;
  };

  Zone.prototype.draw = function (ctx) {
    if (this.state === 'tele') {
      const k = 1 - this.tele / this.teleMax;
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = U.rgba(this.c, 0.25 + k * 0.4);
      ctx.setLineDash([18, 14]);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();
      ctx.restore();
      return;
    }
    const k = this.life / this.lifeMax;
    const pulse = 0.72 + Math.sin(performance.now() * 0.006) * 0.12;
    U.glow(ctx, this.x, this.y, this.r, U.rgba(this.c, 0.24 * pulse), U.rgba(this.c, 0));
    ctx.fillStyle = U.rgba(this.c, 0.20 * pulse);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = U.rgba('#ffd166', 0.4 + k * 0.4);
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.stroke();
  };

  /* ====================== BEAM (canalisé) ================================
     Lux R, Vel'Koz R : longue annonce, longue activation.                  */
  function Beam(o) {
    this.type = 'beam';
    this.x = o.x; this.y = o.y; this.a = o.a;
    this.len = o.len; this.w = o.w;
    this.cast = o.cast; this.castMax = o.cast;
    this.active = o.active; this.activeMax = o.active;
    this.spin = o.spin || 0;
    this.effect = o.effect || KILL;
    this.c = o.c || '#ff3b6b';
    this.tell = o.tell === undefined ? 1 : o.tell;
    this.state = 'cast';
    this.threat = false;
    this.grazed = false;
  }

  Beam.prototype.update = function (dt, game) {
    this.a += this.spin * dt;
    if (this.state === 'cast') {
      this.cast -= dt;
      if (this.cast <= 0) { this.state = 'on'; game.fx.kick(6); game.audio.zap(); }
      return true;
    }
    this.active -= dt;
    return this.active > 0;
  };

  Beam.prototype._seg = function () {
    return [this.x, this.y, this.x + Math.cos(this.a) * this.len, this.y + Math.sin(this.a) * this.len];
  };

  Beam.prototype.hits = function (px, py, pr) {
    if (this.state !== 'on') return false;
    const s = this._seg();
    return U.distToSeg(px, py, s[0], s[1], s[2], s[3]) < this.w * 0.5 + pr;
  };

  Beam.prototype.edge = function (px, py) {
    if (this.state !== 'on') return -1;
    const s = this._seg();
    return U.distToSeg(px, py, s[0], s[1], s[2], s[3]) - this.w * 0.5;
  };

  Beam.prototype.draw = function (ctx) {
    const s = this._seg();
    ctx.save();
    ctx.lineCap = 'round';
    if (this.state === 'cast') {
      const k = 1 - this.cast / this.castMax;
      ctx.lineWidth = this.w * (0.22 + k * 0.5);
      ctx.strokeStyle = U.rgba(this.c, (0.2 + k * 0.5) * this.tell);
      ctx.setLineDash([26, 20]);
      ctx.lineDashOffset = -performance.now() * 0.05;
    } else {
      const k = this.active / this.activeMax;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = this.w * (0.78 + k * 0.4);
      ctx.strokeStyle = U.rgba(this.c, 0.55);
      ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
      ctx.lineWidth = this.w * 0.36;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
    }
    ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
    ctx.restore();
  };

  root.LolEnt = { LineShot, Circle, Cone, Zone, Beam, KILL };
})(window);
</script>
<script>
/* ==== js/lol/units.js ==== */
/* ==========================================================================
   lol/units.js — champions ennemis et sbires
   --------------------------------------------------------------------------
   Le caster est le « tell » de LoL : on ne réagit pas à un projectile qui
   surgit, on réagit à une animation d'incantation. Et surtout, TANT QU'IL
   INCANTE IL CORRIGE SA VISÉE — donc re-cliquer pendant ce temps déplace la
   ligne. C'est exactement le juke de LoL.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.LOLCFG;

  /* ====================== PRÉDICTION ======================================
     Là où sera le joueur dans `t` secondes SI il garde son ordre de
     déplacement actuel. C'est pour ça qu'un simple re-clic fait rater.      */
  function futurePos(p, t) {
    if (!p.moveTarget) return { x: p.x, y: p.y };
    const dx = p.moveTarget.x - p.x, dy = p.moveTarget.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { x: p.x, y: p.y };
    const travel = Math.min(p.speed() * t, d);
    return { x: p.x + dx / d * travel, y: p.y + dy / d * travel };
  }

  /** Point visé : mélange entre position actuelle et position anticipée,
      selon `predict` de la difficulté, plus une erreur en unités. */
  function aimPoint(caster, game, projSpeed, extraDelay) {
    const p = game.player, d = game.diff;
    let t = (extraDelay || 0);
    for (let i = 0; i < 2; i++) {
      const f = futurePos(p, t);
      t = (extraDelay || 0) + U.dist(caster.x, caster.y, f.x, f.y) / Math.max(200, projSpeed);
    }
    const f = futurePos(p, t);
    let ax = U.lerp(p.x, f.x, d.predict);
    let ay = U.lerp(p.y, f.y, d.predict);
    if (d.predictNoise) {
      const na = U.rr(0, U.TAU), nd = U.rr(0, d.predictNoise);
      ax += Math.cos(na) * nd; ay += Math.sin(na) * nd;
    }
    return { x: ax, y: ay };
  }

  /* ====================== CASTER ========================================= */
  function Caster(game, x, y) {
    this.game = game;
    this.x = x; this.y = y;
    this.r = CFG.CASTER.r;
    this.aim = 0;
    this.alive = true;
    this.casting = null;        // {ability, left, max}
    this.gcd = U.rr(0.4, 1.8);  // délai avant la première incantation
    this.cds = Object.create(null);
    this.dest = null;
    this.repos = 0;
    this.hue = U.pick(['#ff4d7a', '#c77dff', '#ff8a3d', '#7b8cff', '#ff3b6b']);
    this.bob = U.rr(0, U.TAU);
  }

  /** Se replace pour rester dans sa fenêtre de portée : ni collé, ni hors jeu. */
  Caster.prototype.reposition = function (dt) {
    const p = this.game.player, A = this.game.arena;
    this.repos -= dt;
    const d = U.dist(this.x, this.y, p.x, p.y);
    const [lo, hi] = CFG.CASTER.keepRange;

    if (this.repos <= 0 || !this.dest || d < lo * 0.75 || d > hi * 1.3) {
      this.repos = U.rr(CFG.CASTER.repositionEvery[0], CFG.CASTER.repositionEvery[1]);
      const want = U.rr(lo, hi);
      const base = Math.atan2(this.y - p.y, this.x - p.x);
      const a = base + U.rr(-0.9, 0.9);
      let dx = p.x + Math.cos(a) * want, dy = p.y + Math.sin(a) * want;
      // Ils restent dans l'arène : pas d'ennemi qui tire depuis le néant.
      const fromC = U.dist(dx, dy, A.cx, A.cy);
      if (fromC > A.radius * 0.94) {
        const ca = Math.atan2(dy - A.cy, dx - A.cx);
        dx = A.cx + Math.cos(ca) * A.radius * 0.94;
        dy = A.cy + Math.sin(ca) * A.radius * 0.94;
      }
      this.dest = { x: dx, y: dy };
    }

    if (this.dest) {
      const ddx = this.dest.x - this.x, ddy = this.dest.y - this.y;
      const dd = Math.hypot(ddx, ddy);
      if (dd > 6) {
        // On ne bouge pas en incantant : comme en jeu, le cast enracine.
        const sp = CFG.CASTER.speed * (this.casting ? 0 : 1);
        const step = Math.min(sp * dt, dd);
        this.x += ddx / dd * step;
        this.y += ddy / dd * step;
      }
    }
  };

  Caster.prototype.startCast = function (ab, game) {
    const d = game.diff;
    const castTime = Math.max(0.06, ab.cast * d.castTimeMul);
    this.casting = { ab, left: castTime, max: castTime };
    this.cds[ab.id] = ab.cd * U.rr(0.85, 1.2);
    // Le sort est créé dès le début de l'incantation : il s'affiche au sol et
    // continue de suivre la visée du lanceur jusqu'au tir.
    ab.spawn(this, game, castTime);
    game.audio.cast();
  };

  Caster.prototype.update = function (dt, game) {
    this.bob += dt * 3;
    this.reposition(dt);

    for (const k in this.cds) if (this.cds[k] > 0) this.cds[k] -= dt;

    if (this.casting) {
      // Visée corrigée en continu pendant toute l'incantation.
      const ab = this.casting.ab;
      const pt = aimPoint(this, game, ab.speed || 1600, this.casting.left);
      this.aim = Math.atan2(pt.y - this.y, pt.x - this.x);
      this.casting.left -= dt;
      if (this.casting.left <= 0) this.casting = null;
      return;
    }

    const p = game.player;
    this.aim = Math.atan2(p.y - this.y, p.x - this.x);
    if (this.gcd > 0) this.gcd -= dt;
  };

  Caster.prototype.ready = function () { return !this.casting && this.gcd <= 0; };

  Caster.prototype.draw = function (ctx) {
    const wob = Math.sin(this.bob) * 3;

    // Portée de menace : discrète, mais elle apprend le spacing.
    if (this.casting) {
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = U.rgba(this.hue, 0.18);
      ctx.beginPath(); ctx.arc(this.x, this.y, this.casting.ab.range, 0, U.TAU); ctx.stroke();
      ctx.restore();
    }

    U.glow(ctx, this.x, this.y + wob, this.r * 2.4, U.rgba(this.hue, 0.30), U.rgba(this.hue, 0));
    ctx.fillStyle = 'rgba(14,17,32,.95)';
    ctx.beginPath(); ctx.arc(this.x, this.y + wob, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = this.hue;
    ctx.stroke();

    // Direction de visée : le petit repère qui permet d'anticiper.
    ctx.save();
    ctx.translate(this.x, this.y + wob);
    ctx.rotate(this.aim);
    ctx.fillStyle = this.hue;
    ctx.beginPath();
    ctx.moveTo(this.r * 1.35, 0);
    ctx.lineTo(this.r * 0.62, -this.r * 0.42);
    ctx.lineTo(this.r * 0.62, this.r * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Barre d'incantation : le tell principal, exactement comme en jeu.
    if (this.casting) {
      const k = 1 - this.casting.left / this.casting.max;
      const w = this.r * 2.4, h = 13;
      const bx = this.x - w / 2, by = this.y - this.r - 40;
      ctx.fillStyle = 'rgba(0,0,0,.72)';
      ctx.fillRect(bx - 2, by - 2, w + 4, h + 4);
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = k > 0.75 ? '#fff' : '#ffd166';
      ctx.fillRect(bx, by, w * k, h);
      ctx.font = '700 22px Segoe UI, Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText(this.casting.ab.key, this.x, by - 10);
    }
  };

  /* ====================== MINION =========================================
     Ils n'attaquent pas : ils existent pour bloquer. Se placer derrière un
     sbire est une esquive à part entière, comme contre un hook.            */
  function Minion(game, x, y) {
    this.game = game;
    this.x = x; this.y = y;
    this.r = CFG.MINION.r;
    this.alive = true;
    this.respawn = 0;
    this.a = U.rr(0, U.TAU);
    this.turn = U.rr(-0.5, 0.5);
  }

  Minion.prototype.absorb = function (game) {
    this.alive = false;
    this.respawn = CFG.MINION.respawn;
    game.fx.burst(this.x, this.y, 22, '#9aa6ff', 520, 7, 0.55);
    game.fx.text(this.x, this.y - 60, 'BLOQUÉ', '#9aa6ff', 26, 60);
    game.stats.blocked++;
    game.audio.block();
  };

  Minion.prototype.update = function (dt, game) {
    if (!this.alive) {
      this.respawn -= dt;
      if (this.respawn <= 0) {
        const A = game.arena, p = game.player;
        const a = U.rr(0, U.TAU), d = U.rr(300, 620);
        this.x = p.x + Math.cos(a) * d;
        this.y = p.y + Math.sin(a) * d;
        // On ne le fait pas réapparaître hors de l'arène.
        const fc = U.dist(this.x, this.y, A.cx, A.cy);
        if (fc > A.radius * 0.9) {
          const ca = Math.atan2(this.y - A.cy, this.x - A.cx);
          this.x = A.cx + Math.cos(ca) * A.radius * 0.9;
          this.y = A.cy + Math.sin(ca) * A.radius * 0.9;
        }
        this.alive = true;
      }
      return;
    }
    this.a += this.turn * dt;
    this.x += Math.cos(this.a) * CFG.MINION.speed * dt;
    this.y += Math.sin(this.a) * CFG.MINION.speed * dt;

    const A = game.arena;
    const d = U.dist(this.x, this.y, A.cx, A.cy);
    if (d > A.radius * 0.9) {                     // ils restent dans l'arène
      this.a = Math.atan2(A.cy - this.y, A.cx - this.x) + U.rr(-0.4, 0.4);
    }
  };

  Minion.prototype.draw = function (ctx) {
    if (!this.alive) return;
    U.glow(ctx, this.x, this.y, this.r * 1.9, 'rgba(154,166,255,.18)', 'rgba(154,166,255,0)');
    ctx.fillStyle = 'rgba(28,34,62,.95)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, U.TAU); ctx.fill();
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(154,166,255,.8)';
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(154,166,255,.3)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.55, 0, U.TAU); ctx.stroke();
  };

  root.LolUnits = { Caster, Minion, aimPoint, futurePos };
})(window);
</script>
<script>
/* ==== js/lol/abilities.js ==== */
/* ==========================================================================
   lol/abilities.js — kits ennemis
   --------------------------------------------------------------------------
   Archétypes de skillshots LoL, avec leurs vraies grandeurs de référence.
   Poids skill / spam / brutal : le directeur tire dedans selon le profil de
   la difficulté, comme dans le mode classique.

   Effets :
     kill     -> mort immédiate
     root     -> immobilisé (le Flash fonctionne encore)
     pull     -> tiré vers le lanceur puis immobilisé
     knockup  -> projeté, aucune action possible
     slow     -> vitesse réduite
   Un CC ne tue pas : il te met en position de mourir du sort suivant.
   C'est ça, mourir en LoL.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, E = root.LolEnt, Units = root.LolUnits;

  /** Sorts sans projectile (cône, rayon) : leur « vitesse » sert uniquement à
      estimer le temps de vol pour la visée prédictive. Elle doit être quasi
      infinie, sinon le lanceur anticipe des secondes de déplacement et vise
      très au-delà de sa propre portée. */
  const INSTANT = 99999;

  function mul(game) { return game.diff.projSpeedMul; }
  function tell(game) {
    return game.diff.tell * (game.player.has('ward') ? 1.9 : 1);
  }

  /** Point visé au moment où le sort partira. */
  function target(caster, game, speed, castTime) {
    return Units.aimPoint(caster, game, speed, castTime);
  }

  function line(caster, game, castTime, o) {
    const speed = o.speed * mul(game);
    const pt = target(caster, game, speed, castTime);
    caster.aim = Math.atan2(pt.y - caster.y, pt.x - caster.x);
    game.hazards.push(new E.LineShot({
      x: caster.x, y: caster.y, a: caster.aim,
      speed, width: o.width, range: o.range,
      cast: castTime, collides: o.collides,
      effect: o.effect, c: o.c, tell: tell(game), caster
    }));
  }

  const ABILITIES = [
    /* ---------------- TIER 0 : les fondamentaux --------------------- */
    {
      id: 'hook', key: 'Q', name: 'Grappin', tier: 0,
      w: { skill: 1.0, spam: 0.1, brutal: 0.2 },
      cast: 0.25, cd: 7, range: 1050, speed: 1800,
      spawn(c, g, ct) {
        line(c, g, ct, {
          speed: 1800, width: 90, range: 1050,
          collides: g.diff.minions > 0,      // en infernal, plus rien ne bloque
          effect: { kind: 'pull', dur: 1.0, from: c }, c: '#ffd166'
        });
      }
    },
    {
      id: 'bind', key: 'Q', name: 'Enchaînement', tier: 0,
      w: { skill: 1.0, spam: 0.1, brutal: 0.3 },
      cast: 0.25, cd: 8, range: 1300, speed: 1200,
      spawn(c, g, ct) {
        line(c, g, ct, {
          speed: 1200, width: 100, range: 1300,
          collides: g.diff.minions > 0,
          effect: { kind: 'root', dur: 1.5 }, c: '#c77dff'
        });
      }
    },
    {
      id: 'poke', key: 'Q', name: 'Trait mystique', tier: 0,
      w: { skill: 1.0, spam: 0.4, brutal: 0.3 },
      cast: 0.25, cd: 4.5, range: 1150, speed: 2000,
      spawn(c, g, ct) {
        line(c, g, ct, {
          speed: 2000, width: 70, range: 1150,
          collides: false,                    // traverse tout
          effect: E.KILL, c: '#4de3ff'
        });
      }
    },
    {
      id: 'bomb', key: 'Q', name: 'Bombe', tier: 0,
      w: { skill: 0.9, spam: 0.5, brutal: 0.5 },
      cast: 0.25, cd: 6, range: 900, speed: 1700,
      spawn(c, g, ct) {
        const A = g.diff.aoe;
        const linger = A.linger + A.lingerGrowth * g.director.I;
        const flight = 0.45;
        const pt = target(c, g, 1700 * mul(g), ct + flight);
        g.hazards.push(new E.Circle({
          x: pt.x, y: pt.y, r: A.radius,
          tele: ct + flight, linger,
          secondary: A.secondary, c: '#ff8a3d'
        }));
      }
    },

    /* ---------------- TIER 1 : zone et contrôle --------------------- */
    {
      id: 'cone', key: 'W', name: 'Souffle', tier: 1,
      w: { skill: 1.0, spam: 0.2, brutal: 0.3 },
      cast: 0.45, cd: 9, range: 760, speed: INSTANT,
      spawn(c, g, ct) {
        const pt = target(c, g, 3000, ct);
        c.aim = Math.atan2(pt.y - c.y, pt.x - c.x);
        g.hazards.push(new E.Cone({
          x: c.x, y: c.y, a: c.aim, half: 0.46, range: 760,
          cast: ct, active: 0.45, effect: E.KILL,
          c: '#c77dff', tell: tell(g), caster: c
        }));
      }
    },
    {
      id: 'zone', key: 'W', name: 'Brasier', tier: 1,
      w: { skill: 0.9, spam: 0.4, brutal: 0.4 },
      cast: 0.35, cd: 10, range: 900, speed: 1400,
      spawn(c, g, ct) {
        const pt = target(c, g, 1400 * mul(g), ct + 0.35);
        g.hazards.push(new E.Zone({
          x: pt.x, y: pt.y, r: 200,
          tele: ct + 0.35, life: 4.2 + g.director.I * 0.35,
          effect: E.KILL, c: '#ff5a3d'
        }));
      }
    },
    {
      id: 'chill', key: 'E', name: 'Morsure', tier: 1,
      w: { skill: 0.8, spam: 0.4, brutal: 0.5 },
      cast: 0.25, cd: 7, range: 1100, speed: 1500,
      spawn(c, g, ct) {
        line(c, g, ct, {
          speed: 1500, width: 80, range: 1100, collides: false,
          effect: { kind: 'slow', dur: 2.4, amount: 0.45 }, c: '#7b8cff'
        });
      }
    },

    /* ---------------- TIER 2 : superposition ------------------------ */
    {
      id: 'fan', key: 'Q', name: 'Salve triple', tier: 2,
      w: { skill: 0.7, spam: 1.0, brutal: 0.4 },
      cast: 0.3, cd: 8, range: 1150, speed: 1750,
      spawn(c, g, ct) {
        const speed = 1750 * mul(g);
        const pt = target(c, g, speed, ct);
        c.aim = Math.atan2(pt.y - c.y, pt.x - c.x);
        const spread = U.lerp(0.22, 0.10, U.clamp(g.director.I / 5, 0, 1));
        for (let k = -1; k <= 1; k++) {
          g.hazards.push(new E.LineShot({
            x: c.x, y: c.y, a: c.aim + k * spread,
            speed, width: 66, range: 1150, cast: ct,
            collides: false, effect: E.KILL, c: '#4de3ff',
            tell: tell(g), caster: k === 0 ? c : null
          }));
        }
      }
    },
    {
      id: 'barrage', key: 'R', name: 'Barrage', tier: 2,
      w: { skill: 0.3, spam: 1.0, brutal: 0.6 },
      cast: 0.5, cd: 13, range: 1300, speed: 1500,
      spawn(c, g, ct) {
        const A = g.diff.aoe;
        const n = U.ri(A.count[0], A.count[1]);
        const linger = A.linger + A.lingerGrowth * g.director.I;
        for (let i = 0; i < n; i++) {
          g.schedule(i * U.rr(0.08, 0.22), () => {
            if (!c.alive) return;
            const pt = i === 0
              ? target(c, g, 1500 * mul(g), ct)
              : (() => { const a = U.rr(0, U.TAU), d = U.rr(120, 700);
                         const b = target(c, g, 1500 * mul(g), ct);
                         return { x: b.x + Math.cos(a) * d, y: b.y + Math.sin(a) * d }; })();
            g.hazards.push(new E.Circle({
              x: pt.x, y: pt.y, r: A.radius * U.rr(0.8, 1.1),
              tele: Math.max(0.18, ct), linger, secondary: 0, c: '#ff8a3d'
            }));
          });
        }
      }
    },

    /* ---------------- TIER 3 : engagement ---------------------------- */
    {
      id: 'engage', key: 'R', name: 'Charge', tier: 3,
      w: { skill: 0.6, spam: 0.4, brutal: 1.0 },
      cast: 0.4, cd: 14, range: 1300, speed: 1400,
      spawn(c, g, ct) {
        const pt = target(c, g, 1400 * mul(g), ct + 0.35);
        g.hazards.push(new E.Circle({
          x: pt.x, y: pt.y, r: 260,
          tele: ct + 0.35, linger: 0.3, secondary: 0,
          effect: { kind: 'knockup', dur: 1.1 }, c: '#ff3b6b'
        }));
        // Le lanceur saute sur le point d'impact : la menace reste sur place.
        g.schedule(ct + 0.35, () => {
          if (!c.alive) return;
          g.fx.burst(c.x, c.y, 18, c.hue, 640, 7, 0.4);
          c.x = pt.x; c.y = pt.y; c.dest = null;
          g.fx.burst(c.x, c.y, 24, c.hue, 760, 8, 0.5);
        });
      }
