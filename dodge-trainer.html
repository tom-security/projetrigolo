<script>
/* ==== js/lol/arena.js ==== */
/* ==========================================================================
   lol/arena.js — terrain et caméra du mode LoL
   Caméra qui suit le champion, comme la vue de jeu par défaut.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U;

  function Arena(game) {
    this.game = game;
    this.cx = 0; this.cy = 0;
    this.radius = 1200;
    this.camX = 0; this.camY = 0;
    this.outTimer = 0;
  }

  Arena.prototype.init = function (diff) {
    this.diff = diff;
    this.baseRadius = diff.arenaRadius;
    this.radius = this.targetRadius = this.baseRadius;
    this.cx = this.cy = 0;
    this.camX = this.camY = 0;
    this.outTimer = 0;
  };

  /* Le mode LoL n'a pas de piliers : les seuls bloqueurs sont les sbires. */
  Arena.prototype.blocks = function () { return null; };

  Arena.prototype.update = function (dt, player, elapsed) {
    const d = this.diff;
    const phase = Math.floor(elapsed / d.shrinkPeriod);
    const k = (elapsed % d.shrinkPeriod) / d.shrinkPeriod;
    const floor = U.lerp(1, d.shrinkTo, U.clamp(phase / 4, 0, 1));
    this.targetRadius = this.baseRadius * U.lerp(floor, floor * 0.88, U.smooth(k));
    this.radius = U.approach(this.radius, this.targetRadius, 120 * dt);

    const out = U.dist(player.x, player.y, this.cx, this.cy) - this.radius;
    if (out > 0) {
      this.outTimer += dt;
      player.outOfBounds = true;
      player.outRatio = U.clamp(this.outTimer / d.outOfBoundsGrace, 0, 1);
      if (this.outTimer >= d.outOfBoundsGrace) return 'collapse';
    } else {
      this.outTimer = Math.max(0, this.outTimer - dt * 2.2);
      player.outOfBounds = false;
      player.outRatio = this.outTimer / d.outOfBoundsGrace;
    }
    return null;
  };

  Arena.prototype.updateCamera = function (dt, player) {
    // Suivi souple avec une légère avance sur le déplacement : on voit venir
    // ce vers quoi on court, comme avec la caméra semi-verrouillée.
    const tx = player.x + player.vx * 0.12;
    const ty = player.y + player.vy * 0.12;
    const s = 1 - Math.pow(0.0009, dt);
    this.camX += (tx - this.camX) * s;
    this.camY += (ty - this.camY) * s;
  };

  Arena.prototype.innerRadius = function () { return this.radius * 0.45; };

  Arena.prototype.drawFloor = function (ctx, view) {
    const g = 260;                       // grille à l'échelle LoL
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(90,110,190,.075)';
    ctx.beginPath();
    for (let x = Math.floor(view.x0 / g) * g; x < view.x1; x += g) { ctx.moveTo(x, view.y0); ctx.lineTo(x, view.y1); }
    for (let y = Math.floor(view.y0 / g) * g; y < view.y1; y += g) { ctx.moveTo(view.x0, y); ctx.lineTo(view.x1, y); }
    ctx.stroke();
  };

  Arena.prototype.drawBounds = function (ctx, view, elapsed) {
    const danger = this.outTimer > 0;
    ctx.save();
    ctx.beginPath();
    ctx.rect(view.x0, view.y0, view.x1 - view.x0, view.y1 - view.y0);
    ctx.arc(this.cx, this.cy, this.radius, 0, U.TAU, true);
    ctx.fillStyle = danger ? 'rgba(120,10,25,.42)' : 'rgba(80,10,30,.26)';
    ctx.fill();
    ctx.restore();

    const shrinking = this.radius - this.targetRadius > 2;
    ctx.save();
    ctx.lineWidth = shrinking ? 9 : 6;
    ctx.strokeStyle = danger ? '#ff3b30' : (shrinking ? '#ff8a3d' : 'rgba(120,150,255,.55)');
    ctx.setLineDash([46, 34]);
    ctx.lineDashOffset = -elapsed * 70;
    ctx.beginPath(); ctx.arc(this.cx, this.cy, this.radius, 0, U.TAU); ctx.stroke();
    ctx.restore();

    const ch = this.game.objectives && this.game.objectives.activeChallenge;
    if (ch && ch.cond === 'inner') {
      ctx.save();
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(255,209,102,.55)';
      ctx.setLineDash([22, 26]);
      ctx.lineDashOffset = elapsed * 90;
      ctx.beginPath(); ctx.arc(this.cx, this.cy, this.innerRadius(), 0, U.TAU); ctx.stroke();
      ctx.restore();
    }
  };

  root.LolArena = Arena;
})(window);
</script>
<script>
/* ==== js/lol/director.js ==== */
/* ==========================================================================
   lol/director.js — chef d'orchestre du mode LoL
   Gère le nombre de casters présents et la cadence des incantations.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, AB = root.LolAbilities, Units = root.LolUnits;

  function Director(game) {
    this.game = game;
    this.reset(game.diff);
  }

  Director.prototype.reset = function (diff) {
    this.diff = diff;
    this.I = 1;
    this.bonus = 0;                   // surcroît durable infligé par les punitions
    this.next = Math.max(1.0, diff.castEvery * 0.9);
    this.recent = [];
    this.surge = 0; this.surgeT = 0;
  };

  Director.prototype.tier = function () {
    const t = Math.floor(U.inv(1, this.diff.intensityCap, this.I) * (this.diff.maxTier + 1));
    return U.clamp(t, 0, this.diff.maxTier);
  };

  /** Nombre de casters voulu à l'instant t : ils arrivent progressivement. */
  Director.prototype.wantCasters = function () {
    const [lo, hi] = this.diff.casters;
    const k = U.inv(1, this.diff.intensityCap, this.I);
    return Math.round(U.lerp(lo, hi, U.clamp(k, 0, 1)));
  };

  /** Tirage pondéré parmi les sorts disponibles POUR CE LANCEUR.
      Filtrer sur ses recharges est indispensable : sans ça, tirer un sort
      indisponible faisait perdre le tour entier et le rythme s'effondrait. */
  Director.prototype.pickAbility = function (caster) {
    const tier = this.tier(), W = this.diff.tagWeights;
    let pool = AB.ABILITIES.filter(a => a.tier <= tier);
    if (caster) {
      const ready = pool.filter(a => !(caster.cds[a.id] > 0));
      if (ready.length) pool = ready;
    }
    return U.weighted(pool, a => {
      let w = a.w.skill * W.skill + a.w.spam * W.spam + a.w.brutal * W.brutal;
      if (this.recent.indexOf(a.id) >= 0) w *= 0.35;
      if (a.tier === tier && tier > 0) w *= 1.35;
      return w;
    });
  };

  Director.prototype.punish = function (severity) {
    const g = this.game;
    g.fx.blink('#ff3b30', 0.42);
    g.fx.kick(14);
    g.audio.fail();
    const n = 2 + Math.round(severity);
    for (let i = 0; i < n; i++) {
      g.schedule(i * 0.3, () => {
        const ready = g.casters.filter(c => c.alive);
        if (!ready.length) return;
        const c = U.pick(ready);
        c.gcd = 0;
        c.casting = null;
        c.startCast(this.pickAbility(c), g);
      });
    }
    this.surge = 1 + 0.5 * severity;
    this.surgeT = 6;
    // Ce surcroît doit SURVIVRE au recalcul de la rampe fait à chaque frame :
    // il est donc stocké à part et ajouté, pas écrit dans this.I.
    this.bonus += 0.35 * severity;
  };

  Director.prototype.update = function (dt, elapsed) {
    const d = this.diff, g = this.game;
    if (this.bonus > 0) this.bonus = Math.max(0, this.bonus - dt * 0.03);
    this.I = Math.min(d.intensityCap, 1 + elapsed * d.intensityRate + this.bonus);

    if (this.surgeT > 0) { this.surgeT -= dt; if (this.surgeT <= 0) this.surge = 0; }
    const rate = this.I * (1 + (this.surge || 0));

    // --- Effectif ennemi ---------------------------------------------------
    const want = this.wantCasters();
    while (g.casters.length < want) {
      const A = g.arena, p = g.player;
      const a = U.rr(0, U.TAU), dist = U.rr(800, 1100);
      let x = p.x + Math.cos(a) * dist, y = p.y + Math.sin(a) * dist;
      const fc = U.dist(x, y, A.cx, A.cy);
      if (fc > A.radius * 0.92) {
        const ca = Math.atan2(y - A.cy, x - A.cx);
        x = A.cx + Math.cos(ca) * A.radius * 0.92;
        y = A.cy + Math.sin(ca) * A.radius * 0.92;
      }
      const c = new Units.Caster(g, x, y);
      g.casters.push(c);
      g.fx.ring(x, y, 20, 40, c.hue, 700);
    }
    while (g.casters.length > want) {
      const gone = g.casters.pop();
      // Sans ça, les sorts différés déjà programmés (barrage, charge)
      // continuaient de se déclencher pour un ennemi qui n'existe plus.
      if (gone) gone.alive = false;
    }

    // --- Cadence des incantations -----------------------------------------
    this.next -= dt;
    if (this.next <= 0) {
      const interval = Math.max(d.castFloor, d.castEvery / rate);
      this.next = interval * U.rr(0.82, 1.18);

      const ready = g.casters.filter(c => c.ready());
      if (ready.length) {
        const c = U.pick(ready);
        const ab = this.pickAbility(c);
        c.startCast(ab, g);
        this.recent.push(ab.id);
        if (this.recent.length > 3) this.recent.shift();
        g.lastAbility = ab.name;
        g.lastAbilityT = 1.8;
      }

      // À haute intensité, deux ennemis incantent en même temps.
      const overlap = U.clamp((this.I - d.intensityCap * 0.45) / d.intensityCap, 0, 1);
      if (U.chance(overlap * (d.tagWeights.spam > 0.5 ? 0.9 : 0.3))) {
        g.schedule(interval * 0.4, () => {
          const r2 = g.casters.filter(c => c.ready());
          if (r2.length) r2[0].startCast(this.pickAbility(r2[0]), g);
        });
      }
    }
  };

  root.LolDirector = Director;
})(window);
</script>
<script>
/* ==== js/lol/objectives.js ==== */
/* ==========================================================================
   lol/objectives.js — boucle punition / récompense du mode LoL
   Conditions : juke (esquives de justesse), noflash, nocc, inner.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.LOLCFG;

  function Objectives(game) {
    this.game = game;
    this.reset(game.diff);
  }

  Objectives.prototype.reset = function (diff) {
    this.list = diff.objectives.map(o => Object.assign({}, o, { done: false, failed: false }));
    this.index = 0;
    this.activeChallenge = null;
    this.completed = 0;
    this.failed = 0;
    this.banner = null;
    this.bannerT = 0;
  };

  Objectives.prototype.say = function (text, sub, color) {
    this.banner = { text, sub, color: color || '#4de3ff' };
    this.bannerT = 2.6;
  };

  Objectives.prototype.next = function () { return this.list[this.index] || null; };

  Objectives.prototype.award = function (o) {
    const p = this.game.player, b = CFG.BUFFS[o.reward];
    p.grant(o.reward);
    o.done = true;
    this.completed++;
    this.game.fx.blink('#4de3ff', 0.22);
    this.game.fx.text(p.x, p.y - 110, '+ ' + b.name, '#ffd166', 30, 80);
    this.game.fx.burst(p.x, p.y, 34, '#ffd166', 700, 8, 0.8);
    this.game.audio.reward();
    this.say(b.name.toUpperCase() + ' DÉBLOQUÉ', b.desc, '#ffd166');
  };

  Objectives.prototype.failChallenge = function (o, why) {
    o.failed = true;
    this.failed++;
    const p = this.game.player;
    this.game.fx.text(p.x, p.y - 110, 'ÉCHEC', '#ff3b30', 32, 80);
    this.say('OBJECTIF RATÉ', why + ' — vague de punition.', '#ff3b30');
    this.game.director.punish(1 + Math.min(2, this.completed * 0.4));
  };

  Objectives.prototype.update = function (dt, elapsed) {
    if (this.bannerT > 0) this.bannerT -= dt;

    const ch = this.activeChallenge;
    if (ch) {
      ch.left -= dt;

      if (ch.cond === 'inner') {
        const a = this.game.arena;
        const inside = U.dist(this.game.player.x, this.game.player.y, a.cx, a.cy) < a.innerRadius();
        if (!inside) {
          ch.outT = (ch.outT || 0) + dt;
          if (ch.outT > 0.35) {
            this.activeChallenge = null;
            this.failChallenge(ch.src, 'Sorti du cercle intérieur');
            this.index++; return;
          }
        } else ch.outT = 0;
      }

      if (ch.cond === 'noflash' && this.game.stats.flashes > ch.baseFlash) {
        this.activeChallenge = null;
        this.failChallenge(ch.src, 'Flash utilisé');
        this.index++; return;
      }

      if (ch.cond === 'nocc' && this.game.stats.ccTaken > ch.baseCc) {
        this.activeChallenge = null;
        this.failChallenge(ch.src, 'Contrôle subi');
        this.index++; return;
      }

      if (ch.cond === 'juke') {
        ch.progress = this.game.stats.jukes - ch.baseJuke;
        if (ch.progress >= ch.target) {
          this.activeChallenge = null;
          this.award(ch.src);
          this.index++; return;
        }
      }

      if (ch.left <= 0) {
        this.activeChallenge = null;
        if (ch.cond === 'juke') {
          this.failChallenge(ch.src, 'Esquives insuffisantes (' + ch.progress + '/' + ch.target + ')');
        } else {
          this.award(ch.src);
        }
        this.index++; return;
      }
      return;
    }

    const o = this.next();
    if (!o || elapsed < o.t) return;

    if (o.type === 'survive') {
      this.award(o);
      this.index++;
    } else {
      this.activeChallenge = {
        src: o, cond: o.cond, target: o.target || 0,
        left: o.duration, max: o.duration,
        baseJuke: this.game.stats.jukes,
        baseFlash: this.game.stats.flashes,
        baseCc: this.game.stats.ccTaken,
        progress: 0, outT: 0, label: o.label
      };
      this.game.fx.blink('#ffd166', 0.18);
      this.game.audio.challenge();
      this.say('DÉFI : ' + o.label, 'Réussite → ' + CFG.BUFFS[o.reward].name + ' · Échec → punition', '#ffd166');
    }
  };

  root.LolObjectives = Objectives;
})(window);
</script>
<script>
/* ==== js/lol/player.js ==== */
/* ==========================================================================
   lol/player.js — le champion joueur. Aucune attaque, aucun sort offensif.
   --------------------------------------------------------------------------
   Déplacement LoL : on donne un ORDRE (clic droit), le champion part à
   vitesse pleine vers ce point — aucune inertie, aucune accélération. Tout
   le skill est dans le choix du point et l'instant du re-clic.

   Contrôle de foule, fidèle au jeu :
     root    -> immobilisé, mais le Flash passe encore
     pull    -> tiré vers le lanceur, puis immobilisé
     knockup -> projeté : plus rien ne répond
     slow    -> vitesse réduite
   Un CC ne tue pas. Il te met en position de mourir du sort d'après.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.LOLCFG, P = CFG.PLAYER;

  function Player(game) {
    this.game = game;
    this.reset();
  }

  Player.prototype.reset = function () {
    this.x = this.game.arena.cx;
    this.y = this.game.arena.cy;
    this.vx = 0; this.vy = 0;
    this.face = -Math.PI / 2;
    this.moveTarget = null;

    this.buffs = Object.create(null);
    this.msBonus = 0;

    this.rootT = 0;
    this.knockT = 0;
    this.slowT = 0; this.slowAmt = 0;
    this.pull = null;              // traction de grappin en cours
    this.queuedOrder = null;       // ordre donné pendant un CC, joué à sa fin

    this.flashCd = 0;
    this.dashMax = 1; this.dashCharges = 0; this.dashCd = 0;
    this.dashing = 0; this.dashAng = 0;
    this.cleanseCd = 0;
    this.zhonyaCd = 0; this.zhonyaT = 0;
    this.shieldUp = false; this.shieldCd = 0;

    this.iframes = 0;
    this.alive = true;
    this.outOfBounds = false;
    this.outRatio = 0;
    this.clickFx = 0;
    this.clickX = 0; this.clickY = 0;
    this.lastOrderAt = -99;
  };

  Player.prototype.has = function (id) { return !!this.buffs[id]; };

  Player.prototype.grant = function (id) {
    this.buffs[id] = true;
    if (id === 'boots' || id === 'boots2') this.msBonus += 45;
    if (id === 'dash') { this.dashMax = Math.max(1, this.dashMax); this.dashCharges = this.dashMax; }
    if (id === 'dash2') { this.dashMax = 2; this.dashCharges = this.dashMax; }
    if (id === 'shield') this.shieldUp = true;
  };

  Player.prototype.ccMul = function () {
    return this.game.diff.ccMul * (this.has('tenacity') ? 0.6 : 1);
  };

  Player.prototype.speed = function () {
    let s = this.game.diff.ms + this.msBonus;
    if (this.slowT > 0) s *= (1 - this.slowAmt);
    return s;
  };

  /** Immobilisé ? (racine, projection, stase) */
  Player.prototype.stunned = function () {
    return this.rootT > 0 || this.knockT > 0 || this.zhonyaT > 0;
  };

  Player.prototype.invulnerable = function () {
    return this.iframes > 0 || this.dashing > 0 || this.zhonyaT > 0;
  };

  /* --- Ordres et sorts ---------------------------------------------------- */
  Player.prototype.order = function (wx, wy) {
    this.moveTarget = { x: wx, y: wy };
    this.clickX = wx; this.clickY = wy;
    this.clickFx = 0.45;
    this.lastOrderAt = this.game.elapsed;
    this.game.stats.orders++;
  };

  Player.prototype.stop = function () { this.moveTarget = null; };

  Player.prototype.tryFlash = function (wx, wy) {
    // Le Flash traverse la racine — comme en jeu. Pas la projection.
    if (!this.has('flash') || this.flashCd > 0 || this.knockT > 0 || this.zhonyaT > 0) return false;
    const a = Math.atan2(wy - this.y, wx - this.x);
    const d = Math.min(P.flashRange, Math.max(60, U.dist(this.x, this.y, wx, wy)));
    this.game.fx.burst(this.x, this.y, 26, '#ffd166', 700, 7, 0.45);
    this.x += Math.cos(a) * d;
    this.y += Math.sin(a) * d;
    this.game.fx.burst(this.x, this.y, 26, '#ffd166', 700, 7, 0.45);
    this.game.fx.ring(this.x, this.y, 18, 40, '#ffd166', 900);
    this.flashCd = this.game.diff.flashCd;
    this.rootT = 0;                    // le déplacement casse la racine
    this.moveTarget = null;
    this.iframes = Math.max(this.iframes, 0.08);
    this.game.stats.flashes++;
    this.game.audio.flash();
    return true;
  };

  Player.prototype.tryDash = function (wx, wy) {
    if (!this.has('dash') || this.dashCharges <= 0 || this.stunned()) return false;
    this.dashCharges--;
    if (this.dashCd <= 0) this.dashCd = this.game.diff.dashCd;
    this.dashAng = Math.atan2(wy - this.y, wx - this.x);
    this.dashing = P.dashTime;
    this.game.stats.dashes++;
    this.game.fx.ring(this.x, this.y, 14, 30, '#4de3ff', 500);
    this.game.audio.dash();
    return true;
  };

  Player.prototype.tryCleanse = function () {
    if (!this.has('cleanse') || this.cleanseCd > 0) return false;
    if (this.rootT <= 0 && this.knockT <= 0 && this.slowT <= 0) return false;
    this.rootT = this.knockT = this.slowT = 0;
    this.cleanseCd = P.cleanseCd;
    this.game.fx.ring(this.x, this.y, 22, 50, '#4ade80', 700);
    this.game.fx.text(this.x, this.y - 80, 'PURGE', '#4ade80', 24, 70);
    this.game.audio.cleanse();
    return true;
  };

  Player.prototype.tryZhonya = function () {
    if (!this.has('zhonya') || this.zhonyaCd > 0) return false;
    this.zhonyaT = P.zhonyaDur;
    this.zhonyaCd = P.zhonyaCd;
    this.moveTarget = null;
    this.game.fx.ring(this.x, this.y, 28, 60, '#ffd166', 800);
    this.game.audio.zhonya();
    return true;
  };

  /* --- Subir un effet ------------------------------------------------------ */
  Player.prototype.applyEffect = function (eff, haz) {
    if (eff.kind === 'kill') return 'die';

    const m = this.ccMul();
    if (eff.kind === 'root') {
      this.rootT = Math.max(this.rootT, eff.dur * m);
      this.moveTarget = null;
      this.game.fx.text(this.x, this.y - 80, 'ENRACINÉ', '#c77dff', 24, 60);
    } else if (eff.kind === 'pull') {
      this.rootT = Math.max(this.rootT, eff.dur * m);
      this.moveTarget = null;
      const src = eff.from;
      if (src) {                        // tiré vers le lanceur, comme un grappin
        const a = Math.atan2(src.y - this.y, src.x - this.x);
        const d = Math.max(0, U.dist(this.x, this.y, src.x, src.y) - src.r - P.hitbox);
        this.pull = { a, left: d, speed: 1500 };
      }
      this.game.fx.text(this.x, this.y - 80, 'ATTRAPÉ', '#ffd166', 26, 60);
    } else if (eff.kind === 'knockup') {
      this.knockT = Math.max(this.knockT, eff.dur * m);
      this.moveTarget = null;
      this.game.fx.text(this.x, this.y - 80, 'PROJETÉ', '#ff3b6b', 26, 60);
    } else if (eff.kind === 'slow') {
      this.slowT = Math.max(this.slowT, eff.dur * m);
      this.slowAmt = Math.max(this.slowAmt, eff.amount);
      this.game.fx.text(this.x, this.y - 80, 'RALENTI', '#7b8cff', 20, 50);
    }

    this.queuedOrder = null;
    this.game.stats.ccTaken++;
    this.game.fx.kick(9);
    this.game.fx.blink('#ff3b30', 0.18);
    this.game.audio.cc();
    return 'cc';
  };

  /* --- Mise à jour ---------------------------------------------------------- */
  Player.prototype.update = function (dt, In, cursor) {
    // Temps de recharge
    if (this.flashCd > 0) this.flashCd -= dt;
    if (this.cleanseCd > 0) this.cleanseCd -= dt;
    if (this.zhonyaCd > 0) this.zhonyaCd -= dt;
    if (this.iframes > 0) this.iframes -= dt;
    if (this.clickFx > 0) this.clickFx -= dt;
    if (this.zhonyaT > 0) this.zhonyaT -= dt;
    if (this.rootT > 0) this.rootT -= dt;
    if (this.knockT > 0) this.knockT -= dt;
    if (this.slowT > 0) { this.slowT -= dt; if (this.slowT <= 0) this.slowAmt = 0; }

    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.dashCd <= 0 && this.has('dash') && this.dashCharges < this.dashMax) {
      this.dashCharges++;
      if (this.dashCharges < this.dashMax) this.dashCd = this.game.diff.dashCd;
    }
    if (this.shieldCd > 0) {
      this.shieldCd -= dt;
      if (this.shieldCd <= 0) { this.shieldUp = true; this.game.audio.pickup(); }
    }

    // --- Commandes -------------------------------------------------------
    if (In.tapped('flash')) this.tryFlash(cursor.x, cursor.y);
    if (In.tapped('dash')) this.tryDash(cursor.x, cursor.y);
    if (In.tapped('cleanse')) this.tryCleanse();
    if (In.tapped('zhonya')) this.tryZhonya();
    if (In.tapped('stop')) this.stop();

    const ord = In.takeMoveOrder();
    if (ord) {
      const w = this.game.screenToWorld(ord.sx, ord.sy);
      if (this.stunned()) {
        // Comme en jeu : on peut cliquer pendant un CC, le champion part
        // dès qu'il est libéré. Perdre l'ordre obligerait à re-cliquer.
        this.queuedOrder = { x: w.x, y: w.y, held: !!ord.held };
      } else if (ord.held) {
        // Un clic maintenu ne compte pas comme un nouvel ordre : sinon les
        // statistiques de juke seraient faussées.
        this.moveTarget = { x: w.x, y: w.y };
      } else {
        this.order(w.x, w.y);
      }
    }

    // Sortie de CC : on rejoue l'ordre mis en attente.
    if (this.queuedOrder && !this.stunned()) {
      const q = this.queuedOrder;
      this.queuedOrder = null;
      if (q.held) this.moveTarget = { x: q.x, y: q.y };
      else this.order(q.x, q.y);
    }

    // --- Traction du grappin ---------------------------------------------
    if (this.pull) {
      const step = Math.min(this.pull.speed * dt, this.pull.left);
      this.x += Math.cos(this.pull.a) * step;
      this.y += Math.sin(this.pull.a) * step;
      this.pull.left -= step;
      if (this.pull.left <= 0) this.pull = null;
      return;
    }

    // --- Ruée --------------------------------------------------------------
    if (this.dashing > 0) {
      this.dashing -= dt;
      const sp = P.dashRange / P.dashTime;
      this.x += Math.cos(this.dashAng) * sp * dt;
      this.y += Math.sin(this.dashAng) * sp * dt;
      this.face = this.dashAng;
      this.game.fx.trail(this.x, this.y, '#4de3ff', 16);
      return;
    }

    if (this.stunned()) { this.vx = this.vy = 0; return; }

    // --- Déplacement : vitesse pleine vers l'ordre, sans inertie ----------
    if (this.moveTarget) {
      const dx = this.moveTarget.x - this.x, dy = this.moveTarget.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d <= P.stopDist) {
        this.moveTarget = null;
        this.vx = this.vy = 0;
      } else {
        const s = this.speed();
        const step = Math.min(s * dt, d);
        this.x += dx / d * step;
        this.y += dy / d * step;
        this.vx = dx / d * s; this.vy = dy / d * s;
        this.face = Math.atan2(dy, dx);
      }
    } else { this.vx = this.vy = 0; }
  };

  /* --- Rendu ---------------------------------------------------------------- */
  Player.prototype.draw = function (ctx) {
    // Marqueur de clic, comme le curseur de déplacement de LoL.
    if (this.clickFx > 0 && this.moveTarget) {
      const k = this.clickFx / 0.45;
      ctx.save();
      ctx.lineWidth = 4;
      ctx.strokeStyle = U.rgba('#4ade80', k);
      ctx.beginPath(); ctx.arc(this.clickX, this.clickY, 16 + (1 - k) * 26, 0, U.TAU); ctx.stroke();
      ctx.restore();
    }
    // Ligne vers la destination : c'est CE vecteur que l'ennemi anticipe.
    if (this.moveTarget) {
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(74,222,128,.28)';
      ctx.setLineDash([12, 12]);
      ctx.beginPath(); ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.moveTarget.x, this.moveTarget.y); ctx.stroke();
      ctx.restore();
    }

    const inv = this.invulnerable();
    const c = this.zhonyaT > 0 ? '#ffd166' : (inv ? '#ffd166' : '#4de3ff');

    U.glow(ctx, this.x, this.y, P.hitbox * 2.6, U.rgba(c, inv ? 0.40 : 0.24), U.rgba(c, 0));

    // Cercle de sélection, comme sous les pieds d'un champion.
    ctx.save();
    ctx.lineWidth = 4;
    ctx.strokeStyle = U.rgba('#4ade80', 0.55);
    ctx.beginPath(); ctx.ellipse(this.x, this.y + P.hitbox * 0.5, P.hitbox * 1.15, P.hitbox * 0.52, 0, 0, U.TAU);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.face);
    ctx.fillStyle = U.rgba(c, 0.92);
    ctx.beginPath();
    ctx.moveTo(P.visual, 0);
    ctx.lineTo(-P.visual * 0.7, -P.visual * 0.7);
    ctx.lineTo(-P.visual * 0.32, 0);
    ctx.lineTo(-P.visual * 0.7, P.visual * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Hitbox réel, toujours visible : aucune mort inexpliquée.
    ctx.lineWidth = 2;
    ctx.strokeStyle = U.rgba('#fff', 0.5);
    ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox, 0, U.TAU); ctx.stroke();

    if (this.shieldUp) {
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(180,220,255,.85)';
      ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox + 16, 0, U.TAU); ctx.stroke();
    }
    if (this.zhonyaT > 0) {
      ctx.fillStyle = 'rgba(255,209,102,.30)';
      ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox + 26, 0, U.TAU); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = '#ffd166'; ctx.stroke();
    }
    if (this.rootT > 0 || this.knockT > 0) {
      ctx.lineWidth = 6;
      ctx.strokeStyle = this.knockT > 0 ? 'rgba(255,59,107,.9)' : 'rgba(199,125,255,.9)';
      ctx.beginPath(); ctx.arc(this.x, this.y, P.hitbox + 10, 0, U.TAU); ctx.stroke();
    }
  };

  root.LolPlayer = Player;
})(window);
</script>
<script>
/* ==== js/lol/hud.js ==== */
/* ==========================================================================
   lol/hud.js — interface du mode LoL (espace écran)
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.LOLCFG;

  function bar(ctx, x, y, w, h, k, col, bg) {
    ctx.fillStyle = bg || 'rgba(255,255,255,.10)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w * U.clamp(k, 0, 1), h);
  }

  function label(ctx, x, y, t, s, c, a) {
    ctx.font = '700 ' + s + 'px Segoe UI, Inter, sans-serif';
    ctx.textAlign = a || 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = c;
    ctx.fillText(t, x, y);
  }

  /** Case de sort : touche, nom, recharge. */
  function slot(ctx, x, y, s, key, name, ready, cd, cdMax, color) {
    ctx.fillStyle = ready ? 'rgba(255,209,102,.16)' : 'rgba(255,255,255,.05)';
    ctx.fillRect(x, y, s, s);
    ctx.lineWidth = 2;
    ctx.strokeStyle = ready ? color : 'rgba(255,255,255,.14)';
    ctx.strokeRect(x, y, s, s);
    if (!ready && cdMax > 0) {
      const k = U.clamp(cd / cdMax, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.62)';
      ctx.fillRect(x, y, s, s * k);
      label(ctx, x + s / 2, y + s / 2 + 6, Math.ceil(cd) + '', 17, '#fff', 'center');
    }
    label(ctx, x + s / 2, y + s - 6, key, 12, ready ? color : 'rgba(255,255,255,.35)', 'center');
    label(ctx, x + s / 2, y - 6, name, 10, 'rgba(200,210,240,.6)', 'center');
  }

  function draw(ctx, g, w, h) {
    const p = g.player, d = g.diff, o = g.objectives;
    // Sous cette largeur le HUD se replie : sinon le chrono percute le titre
    // d'objectif centré et les deux colonnes basses se chevauchent.
    const compact = w < 820;
    ctx.save();

    /* ---- Chrono, difficulté, intensité --------------------------------- */
    // Signature : présente en jeu dans les deux modes, jamais tapageuse.
    // Sous 820 px elle percuterait le titre d'objectif centré, et la marque
    // figure déjà sur le menu, la pause et l'écran de fin.
    if (!compact) label(ctx, 22, 24, 'DODGE TRAINER', 10, 'rgba(200,210,240,.34)');
    label(ctx, 22, compact ? 56 : 64, U.fmtTime(g.elapsed), compact ? 26 : 38, '#fff');
    label(ctx, 22, 84, 'DODGE LoL · ' + d.name, 11.5, d.color);
    bar(ctx, 22, 94, 168, 5, U.inv(1, d.intensityCap, g.director.I), d.color);
    label(ctx, 196, 99, 'INTENSITÉ ×' + g.director.I.toFixed(2), 10.5, 'rgba(200,210,240,.72)');
    label(ctx, 22, 118, 'PRÉDICTION ENNEMIE ' + Math.round(d.predict * 100) + '%  ·  ' +
      g.casters.length + ' ennemi' + (g.casters.length > 1 ? 's' : ''), 10.5, 'rgba(200,210,240,.5)');

    /* ---- Record --------------------------------------------------------- */
    if (g.best > 0) {
      label(ctx, w - 22, 36, 'RECORD', 10.5, 'rgba(200,210,240,.55)', 'right');
      const beat = g.elapsed > g.best;
      label(ctx, w - 22, 60, U.fmtTime(g.best), 22, beat ? '#4ade80' : '#ffd166', 'right');
      if (beat) label(ctx, w - 22, 78, 'NOUVEAU RECORD', 10.5, '#4ade80', 'right');
    }

    /* ---- Objectif ------------------------------------------------------- */
    const ch = o.activeChallenge;
    if (ch) {
      const bw = 320;
      ctx.fillStyle = 'rgba(8,10,20,.72)';
      ctx.fillRect(w / 2 - bw / 2, 16, bw, 46);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.strokeRect(w / 2 - bw / 2, 16, bw, 46);
      label(ctx, w / 2, 36, 'DÉFI · ' + ch.label, 12.5, '#ffd166', 'center');
      const k = ch.left / ch.max;
      bar(ctx, w / 2 - bw / 2 + 12, 44, bw - 24, 6, k, k < 0.3 ? '#ff3b30' : '#ffd166');
      label(ctx, w / 2, 58,
        ch.cond === 'juke' ? ch.progress + ' / ' + ch.target + ' esquives de justesse'
                           : ch.left.toFixed(1) + ' s restantes',
        11, '#fff', 'center');
    } else {
      const nx = o.next();
      if (nx) {
        label(ctx, w / 2, 32, 'PROCHAIN OBJECTIF · ' + nx.label, 12, 'rgba(200,210,240,.75)', 'center');
        label(ctx, w / 2, 50, 'dans ' + Math.max(0, nx.t - g.elapsed).toFixed(1) + 's  →  ' +
          CFG.BUFFS[nx.reward].name, 11, d.color, 'center');
      } else {
        label(ctx, w / 2, 36, 'TOUS LES OBJECTIFS VALIDÉS · SURVIE PURE', 12, '#4ade80', 'center');
      }
    }

    /* ---- Bannière -------------------------------------------------------- */
    if (o.bannerT > 0 && o.banner) {
      ctx.globalAlpha = U.clamp(o.bannerT / 0.5, 0, 1);
      label(ctx, w / 2, h * 0.28, o.banner.text, 30, o.banner.color, 'center');
      if (o.banner.sub) label(ctx, w / 2, h * 0.28 + 24, o.banner.sub, 13, 'rgba(230,236,255,.8)', 'center');
      ctx.globalAlpha = 1;
    }

    /* ---- Barre de sorts -------------------------------------------------- */
    const slots = [];
    if (p.has('flash'))   slots.push(['F', 'Flash',  p.flashCd <= 0, p.flashCd, d.flashCd, '#ffd166']);
    if (p.has('dash'))    slots.push(['ESP', 'Ruée', p.dashCharges > 0, p.dashCd, d.dashCd, '#4de3ff']);
    if (p.has('cleanse')) slots.push(['A', 'Purge',  p.cleanseCd <= 0, p.cleanseCd, CFG.PLAYER.cleanseCd, '#4ade80']);
    if (p.has('zhonya'))  slots.push(['E', 'Stase',  p.zhonyaCd <= 0, p.zhonyaCd, CFG.PLAYER.zhonyaCd, '#ffd166']);
    const sw = compact ? 38 : 46, gap = compact ? 7 : 9;
    const rowY = h - (compact ? 58 : 70);
    let sx = w / 2 - (slots.length * sw + (slots.length - 1) * gap) / 2;
    for (const s of slots) {
      slot(ctx, sx, rowY, sw, s[0], s[1], s[2], s[3], s[4], s[5]);
      sx += sw + gap;
    }
    // Au-dessus des noms de sorts (rowY - 6), jamais sur la même ligne.
    if (p.has('dash') && p.dashMax > 1) {
      label(ctx, w / 2, rowY - 22, 'CHARGES ' + p.dashCharges + '/' + p.dashMax,
        10, 'rgba(200,210,240,.6)', 'center');
    }

    /* ---- Objets obtenus --------------------------------------------------- */
    const iw = compact ? 21 : 26, istep = compact ? 25 : 31;
    const iy = compact ? 140 : h - 46;
    let bx = 22;
    for (const id in p.buffs) {
      const b = CFG.BUFFS[id];
      if (bx + iw > w - 22) break;            // jamais au-delà du bord
      ctx.fillStyle = 'rgba(255,209,102,.14)';
      ctx.fillRect(bx, iy, iw, 24);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,209,102,.45)';
      ctx.strokeRect(bx, iy, iw, 24);
      label(ctx, bx + iw / 2, iy + 17, b.icon, compact ? 11 : 13, '#ffd166', 'center');
      bx += istep;
    }
    // Le bouclier se voit déjà comme un anneau sur le champion : en compact,
    // ce rappel texte ne vaut pas le chevauchement qu'il provoque.
    if (p.shieldUp && !compact) label(ctx, 22, h - 54, '◇ BOUCLIER DE SORTS PRÊT', 11, '#b4dcff');

    /* ---- Statistiques ----------------------------------------------------- */
    if (!compact) {
      label(ctx, w - 22, h - 62, 'ESQUIVES DE JUSTESSE ' + g.stats.jukes, 11, 'rgba(200,210,240,.5)', 'right');
      label(ctx, w - 22, h - 46, 'CC SUBIS ' + g.stats.ccTaken + '  ·  BLOQUÉS PAR SBIRE ' + g.stats.blocked,
        11, 'rgba(200,210,240,.5)', 'right');
      if (g.lastAbilityT > 0 && g.lastAbility) {
        ctx.globalAlpha = U.clamp(g.lastAbilityT / 0.6, 0, 1) * 0.75;
        label(ctx, w - 22, h - 26, g.lastAbility.toUpperCase(), 12, 'rgba(200,210,240,.9)', 'right');
        ctx.globalAlpha = 1;
      }
    }

    /* ---- État de contrôle ------------------------------------------------- */
    if (p.knockT > 0 || p.rootT > 0 || p.slowT > 0) {
      const txt = p.knockT > 0 ? 'PROJETÉ' : (p.rootT > 0 ? 'ENRACINÉ' : 'RALENTI');
      const col = p.knockT > 0 ? '#ff3b6b' : (p.rootT > 0 ? '#c77dff' : '#7b8cff');
      const t = Math.max(p.knockT, p.rootT, p.slowT);
      label(ctx, w / 2, h * 0.63, txt, 26, col, 'center');
      bar(ctx, w / 2 - 90, h * 0.63 + 12, 180, 7, t / 2, col);
      if (p.has('cleanse') && p.cleanseCd <= 0 && (p.rootT > 0 || p.knockT > 0)) {
        label(ctx, w / 2, h * 0.63 + 36, 'A — PURGER', 13, '#4ade80', 'center');
      }
    }

    /* ---- Hors zone --------------------------------------------------------- */
    if (p.outRatio > 0.02) {
      const k = p.outRatio;
      ctx.save();
      ctx.globalAlpha = k * 0.55;
      const gr = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.25, w / 2, h / 2, Math.max(w, h) * 0.62);
      gr.addColorStop(0, 'rgba(255,59,48,0)');
      gr.addColorStop(1, 'rgba(255,59,48,1)');
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
      if (p.outOfBounds) {
        label(ctx, w / 2, h * 0.16, 'HORS ZONE — ' + ((1 - k) * d.outOfBoundsGrace).toFixed(2) + 's',
          26, '#ff3b30', 'center');
      }
    }

    ctx.restore();
  }

  root.LolHUD = { draw };
})(window);
</script>
<script>
/* ==== js/lol/game.js ==== */
/* ==========================================================================
   lol/game.js — moteur du mode DODGE LoL
   Même interface publique que le mode classique, pour que le menu puisse
   piloter l'un ou l'autre sans rien savoir de leurs différences.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.LOLCFG;

  /* --- Audio ------------------------------------------------------------- */
  function makeAudio() {
    let actx = null, master = null;
    function ensure() {
      if (actx) return actx;
      const AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.16;
      master.connect(actx.destination);
      return actx;
    }
    function tone(f, dur, type, gain, to) {
      const a = ensure(); if (!a) return;
      if (a.state === 'suspended') a.resume();
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, a.currentTime);
      if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), a.currentTime + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.4, a.currentTime + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(master);
      o.start(); o.stop(a.currentTime + dur + 0.02);
    }
    function noise(dur, gain) {
      const a = ensure(); if (!a) return;
      const n = Math.floor(a.sampleRate * dur);
      const buf = a.createBuffer(1, n, a.sampleRate);
      const dta = buf.getChannelData(0);
      for (let i = 0; i < n; i++) dta[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = a.createBufferSource(); s.buffer = buf;
      const g = a.createGain(); g.gain.value = gain || 0.35;
      s.connect(g); g.connect(master); s.start();
    }
    return {
      unlock: () => { const a = ensure(); if (a && a.state === 'suspended') a.resume(); },
      cast:      () => tone(300, 0.14, 'square', 0.14, 460),
      zap:       () => tone(900, 0.11, 'sawtooth', 0.20, 340),
      boom:      () => { noise(0.34, 0.45); tone(70, 0.4, 'sine', 0.55, 28); },
      flash:     () => { tone(1500, 0.14, 'triangle', 0.3, 420); noise(0.1, 0.2); },
      dash:      () => tone(520, 0.09, 'triangle', 0.26, 940),
      cc:        () => { tone(150, 0.3, 'square', 0.3, 70); noise(0.14, 0.24); },
      cleanse:   () => { tone(700, 0.12, 'triangle', 0.28); setTimeout(() => tone(1100, 0.16, 'triangle', 0.26), 80); },
      zhonya:    () => tone(420, 0.45, 'sine', 0.3, 900),
      block:     () => tone(260, 0.1, 'square', 0.22, 160),
      reward:    () => { tone(660, 0.1, 'triangle', 0.3); setTimeout(() => tone(990, 0.16, 'triangle', 0.3), 90); },
      challenge: () => { tone(440, 0.09, 'square', 0.18); setTimeout(() => tone(560, 0.11, 'square', 0.18), 100); },
      fail:      () => { tone(160, 0.35, 'sawtooth', 0.32, 60); noise(0.2, 0.3); },
      pickup:    () => tone(1200, 0.08, 'triangle', 0.2, 1800),
      death:     () => { noise(0.6, 0.5); tone(120, 0.7, 'sawtooth', 0.4, 30); }
    };
  }

  /* --- Jeu ---------------------------------------------------------------- */
  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.state = 'menu';
    this.dpr = 1; this.w = 0; this.h = 0; this.zoom = 1;

    this.diff = CFG.diff('medium');
    this.arena = new root.LolArena(this);
    this.player = new root.LolPlayer(this);
    this.fx = new root.Fx();
    this.audio = makeAudio();

    this.hazards = [];
    this.casters = [];
    this.minions = [];
    this.timers = [];

    this.elapsed = 0;
    this.best = 0;
    this.newRecord = false;
    this.deathCause = '';
    this.lastAbility = null;
    this.lastAbilityT = 0;
    this.stats = { jukes: 0, ccTaken: 0, flashes: 0, dashes: 0, blocked: 0, orders: 0 };

    this.resize();
    root.addEventListener('resize', () => this.resize());
  }

  Game.prototype.resize = function () {
    this.dpr = Math.min(root.devicePixelRatio || 1, 2);
    this.w = this.canvas.clientWidth || root.innerWidth;
    this.h = this.canvas.clientHeight || root.innerHeight;
    this.canvas.width = Math.floor(this.w * this.dpr);
    this.canvas.height = Math.floor(this.h * this.dpr);
    // Cadrage LoL : on montre toujours la même largeur en unités de jeu…
    const framed = Math.min(this.w / CFG.VIEW.unitsWide, this.h / CFG.VIEW.unitsHigh);
    // …mais sur écran étroit ou en portrait, ce calcul tombait à 0,19 et le
    // champion ne faisait plus que 10 px. On garantit une échelle jouable,
    // quitte à voir une portion plus petite de l'arène.
    this.zoom = Math.max(framed, Math.min(this.w, this.h) / 1500);
  };

  Game.prototype.screenToWorld = function (sx, sy) {
    return {
      x: (sx - this.w / 2) / this.zoom + this.arena.camX,
      y: (sy - this.h / 2) / this.zoom + this.arena.camY
    };
  };

  /* --- Persistance ---------------------------------------------------------- */
  Game.prototype.bestKey = function (id) { return 'dodgetrainer.lol.best.' + id; };
  Game.prototype.loadBest = function (id) {
    try { return parseFloat(localStorage.getItem(this.bestKey(id))) || 0; } catch (e) { return 0; }
  };
  Game.prototype.saveBest = function (v) {
    try { localStorage.setItem(this.bestKey(this.diff.id), String(v)); } catch (e) { /* mode privé */ }
  };

  Game.prototype.schedule = function (t, fn) { this.timers.push({ t, fn }); };

  /* --- Cycle de vie ---------------------------------------------------------- */
  Game.prototype.start = function (diffId, opts) {
    this.diff = CFG.diff(diffId);
    this.fx.quality = (opts && opts.quality) || 'high';
    this.fx.shakeEnabled = !(opts && opts.shake === false);

    this.arena.init(this.diff);
    this.player.reset();
    this.fx.reset();
    this.hazards.length = 0;
    this.casters.length = 0;
    this.minions.length = 0;
    this.timers.length = 0;
    this.elapsed = 0;
    this.lastAbility = null;
    this.lastAbilityT = 0;
    this.deathCause = '';
    this.newRecord = false;
    this.stats = { jukes: 0, ccTaken: 0, flashes: 0, dashes: 0, blocked: 0, orders: 0 };
    this.best = this.loadBest(this.diff.id);

    this.director = new root.LolDirector(this);
    this.objectives = new root.LolObjectives(this);

    for (let i = 0; i < this.diff.minions; i++) {
      const a = U.rr(0, U.TAU), d = U.rr(300, 700);
      this.minions.push(new root.LolUnits.Minion(this, this.player.x + Math.cos(a) * d,
                                                       this.player.y + Math.sin(a) * d));
    }

    this.objectives.say('DODGE LoL · ' + this.diff.name, 'Clic droit pour te déplacer. Re-clique pendant leur incantation.', this.diff.color);
    this.audio.unlock();
    this.state = 'playing';
    root.LolInput.clearAll();
  };

  Game.prototype.die = function (cause) {
    if (this.state !== 'playing') return;
    this.player.alive = false;
    this.deathCause = cause;
    this.fx.blink('#ff3b30', 0.75);
    this.fx.kick(26);
    this.fx.burst(this.player.x, this.player.y, 70, '#ff4d7a', 900, 11, 1.1);
    this.fx.ring(this.player.x, this.player.y, 40, 40, '#fff', 1100);
    this.audio.death();

    this.newRecord = this.elapsed > this.best;
    if (this.newRecord) { this.best = this.elapsed; this.saveBest(this.elapsed); }
    this.state = 'dead';
    if (this.onDeath) this.onDeath();
  };

  function deathLabel(hz) {
    switch (hz.type) {
      case 'line':   return 'Touché par un skillshot — il visait où tu allais.';
      case 'circle': return 'Pris dans la zone — elle reste létale jusqu\'au bout.';
      case 'cone':   return 'Pris dans le cône — trop près du lanceur.';
      case 'zone':   return 'Resté dans la zone au sol.';
      case 'beam':   return 'Traversé par le rayon.';
      default:       return 'Éliminé.';
    }
  }

  /* --- Mise à jour ------------------------------------------------------------ */
  Game.prototype.update = function (dt) {
    const p = this.player;
    this.elapsed += dt;
    if (this.lastAbilityT > 0) this.lastAbilityT -= dt;

    for (let i = this.timers.length - 1; i >= 0; i--) {
      const t = this.timers[i];
      t.t -= dt;
      if (t.t <= 0) { this.timers.splice(i, 1); t.fn(); }
    }

    const cursor = this.screenToWorld(root.LolInput.mouse.sx, root.LolInput.mouse.sy);
    p.update(dt, root.LolInput, cursor);

    if (this.arena.update(dt, p, this.elapsed) === 'collapse') {
      this.die('Effondrement de la zone — rester dehors tue.');
      return;
    }

    this.director.update(dt, this.elapsed);
    this.objectives.update(dt, this.elapsed);

    for (const c of this.casters) c.update(dt, this);
    for (const m of this.minions) m.update(dt, this);

    // --- Skillshots : déplacement, collision, comptage des jukes ------------
    const hb = CFG.PLAYER.hitbox;
    const jw = CFG.PLAYER.jukeWindow;
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const hz = this.hazards[i];
      if (!hz.update(dt, this)) { this.hazards.splice(i, 1); continue; }

      if (hz.hits(p.x, p.y, hb)) {
        if (p.invulnerable()) continue;
        if (p.shieldUp) {                       // le bouclier absorbe un sort entier
          p.shieldUp = false;
          p.shieldCd = CFG.PLAYER.shieldRecharge;
          p.iframes = Math.max(p.iframes, 0.25);
          this.fx.ring(p.x, p.y, 22, 70, '#b4dcff', 900);
          this.fx.text(p.x, p.y - 100, 'BLOQUÉ', '#b4dcff', 26, 70);
          this.audio.block();
          this.hazards.splice(i, 1);
          continue;
        }
        if (hz._applied) continue;                 // un sort ne contrôle qu'une fois
        if (p.applyEffect(hz.effect, hz) === 'die') { this.die(deathLabel(hz)); return; }
        // Une zone persistante reste en jeu après avoir touché : sans ce
        // marqueur elle ré-appliquait son contrôle à chaque frame (36 fois
        // pour une seule projection), gonflant le compteur et la bande-son.
        hz._applied = true;
        if (hz.type === 'line') this.hazards.splice(i, 1);   // un hook ne traverse pas
        continue;
      }

      // Esquive « de justesse » : le sort te frôle au plus près puis s'éloigne.
      if (hz.threat) {
        const d = hz.edge(p.x, p.y);
        if (d >= 0 && d < jw) {
          if (hz._prev !== undefined && d > hz._prev && !hz.grazed) {
            hz.grazed = true;
            this.stats.jukes++;
            this.fx.text(p.x, p.y - 70, 'ESQUIVÉ', '#4ade80', 20, 60);
            this.fx.spawn(p.x, p.y, U.rr(-60, 60), U.rr(-160, -60), 0.5, 5, '#4ade80', 2, false);
          }
          hz._prev = d;
        }
      }
    }

    if (this.hazards.length > 900) this.hazards.splice(0, this.hazards.length - 900);

    this.fx.update(dt);
    this.arena.updateCamera(dt, p);
  };

  /* --- Rendu ------------------------------------------------------------------ */
  Game.prototype.render = function () {
    const ctx = this.ctx, w = this.w, h = this.h;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#07080f';
    ctx.fillRect(0, 0, w, h);
    if (this.state === 'menu') return;

    const z = this.zoom;
    const camX = this.arena.camX + this.fx.shakeX / z;
    const camY = this.arena.camY + this.fx.shakeY / z;

    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(z, z);
    ctx.translate(-camX, -camY);

    const hw = (w / 2) / z + 200, hh = (h / 2) / z + 200;
    const view = { x0: camX - hw, y0: camY - hh, x1: camX + hw, y1: camY + hh };

    this.arena.drawFloor(ctx, view);
    this.arena.drawBounds(ctx, view, this.elapsed);

    // Au sol d'abord, en vol ensuite : jamais un skillshot caché sous une zone.
    for (const hz of this.hazards) if (hz.type === 'zone' || hz.type === 'circle') hz.draw(ctx);
    for (const m of this.minions) m.draw(ctx);
    for (const c of this.casters) c.draw(ctx);
    for (const hz of this.hazards) if (hz.type !== 'zone' && hz.type !== 'circle') hz.draw(ctx);

    this.fx.drawParticles(ctx);
    if (this.player.alive) this.player.draw(ctx);
    this.fx.drawTexts(ctx);

    ctx.restore();

    this.fx.drawFlash(ctx, w, h);
    if (this.state === 'playing' || this.state === 'paused') root.LolHUD.draw(ctx, this, w, h);
  };

  root.LolGame = Game;
})(window);
</script>
<script>
/* ==== js/main.js ==== */
/* ==========================================================================
   main.js — menus, sélection du mode et de la difficulté, boucle principale
   --------------------------------------------------------------------------
   Deux modes cohabitent, chacun avec son propre moteur :
     · classic : bullet-hell au clavier          (CFG    / Game)
     · lol     : dodge LoL au clic droit         (LOLCFG / LolGame)
   Les deux exposent la même interface publique, donc ce fichier ne sait rien
   de leurs différences — il se contente de router.
   ========================================================================== */
(function (root) {
  'use strict';
  const U = root.U, CFG = root.CFG, LOLCFG = root.LOLCFG;

  const canvas = document.getElementById('game');

  const game = new root.Game(canvas);          // mode classique, inchangé
  const lolGame = new root.LolGame(canvas);    // mode LoL
  root.Input.attach(canvas);
  root.LolInput.attach(canvas);

  // Exposés pour le débogage et pour brancher un bot externe.
  root.DODGE = game;
  root.DODGE_LOL = lolGame;

  const el = {
    menu: document.getElementById('menu'),
    pause: document.getElementById('pause'),
    dead: document.getElementById('dead'),
    modeList: document.getElementById('mode-list'),
    list: document.getElementById('difficulty-list'),
    details: document.getElementById('diff-details'),
    terrainRow: document.getElementById('terrain-row'),
    terrainHint: document.getElementById('terrain-hint'),
    controls: document.getElementById('controls'),
    start: document.getElementById('start-btn'),
    resume: document.getElementById('resume-btn'),
    quit: document.getElementById('quit-btn'),
    retry: document.getElementById('retry-btn'),
    toMenu: document.getElementById('menu-btn'),
    cause: document.getElementById('death-cause'),
    stats: document.getElementById('run-stats'),
    verdict: document.getElementById('run-verdict')
  };

  /* --- Modes --------------------------------------------------------------- */
  const MODES = [
    {
      id: 'classic', name: 'BULLET-HELL', color: '#4de3ff',
      tag: 'Clavier · ZQSD',
      desc: 'Esquive de rideaux de projectiles, déplacement libre au clavier. Frôlement, dash, adrénaline.',
      controls: [
        ['ZQSD / WASD / ↑←↓→', 'bouger'],
        ['Espace', 'dash <em>(à débloquer)</em>'],
        ['Maj', 'focus <em>(à débloquer)</em>'],
        ['E', 'adrénaline <em>(à débloquer)</em>'],
        ['Échap', 'pause · <b>R</b> relancer']
      ]
    },
    {
      id: 'lol', name: 'DODGE LoL', color: '#ffd166',
      tag: 'Souris · clic droit',
      desc: 'Déplacement au clic droit. Les ennemis incantent en visant où ton ordre de déplacement t\'emmène : on esquive en re-cliquant.',
      controls: [
        ['Clic droit', 'se déplacer'],
        ['S', 'stopper'],
        ['F', 'Flash <em>(à débloquer)</em>'],
        ['Espace', 'ruée <em>(à débloquer)</em>'],
        ['A', 'purge · <b>E</b> stase'],
        ['Échap', 'pause · <b>R</b> relancer']
      ]
    }
  ];

  function mode() { return prefs.mode === 'lol' ? MODES[1] : MODES[0]; }
  function isLol() { return prefs.mode === 'lol'; }
  function C() { return isLol() ? LOLCFG : CFG; }
  function G() { return isLol() ? lolGame : game; }

  /* --- Préférences persistées ----------------------------------------------- */
  const PREF_KEY = 'dodgetrainer.prefs';
  const prefs = Object.assign(
    { mode: 'classic', diff: 'medium', lolDiff: 'medium', endless: false, quality: 'high', shake: true },
    (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; } })()
  );
  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ }
  }

  /** Chaque mode retient sa propre difficulté. */
  function curDiff() { return isLol() ? prefs.lolDiff : prefs.diff; }
  function setDiff(id) {
    if (isLol()) prefs.lolDiff = id; else prefs.diff = id;
  }

  function bestOf(d) {
    return isLol() ? lolGame.loadBest(d.id) : game.loadBest(d.id, prefs.endless);
  }

  /* --- Construction du menu -------------------------------------------------- */
  function buildModes() {
    el.modeList.innerHTML = '';
    for (const m of MODES) {
      const b = document.createElement('button');
      b.className = 'mode-card' + (m.id === prefs.mode ? ' active' : '');
      b.style.setProperty('--c', m.color);
      b.innerHTML =
        '<div class="mname">' + m.name + '</div>' +
        '<div class="mtag">' + m.tag + '</div>' +
        '<div class="mdesc">' + m.desc + '</div>';
      b.addEventListener('click', () => { prefs.mode = m.id; savePrefs(); buildMenu(); });
      el.modeList.appendChild(b);
    }
  }

  function buildMenu() {
    buildModes();
    el.list.innerHTML = '';
    for (const d of C().DIFFICULTIES) {
      const best = bestOf(d);
      const card = document.createElement('button');
      card.className = 'diff-card' + (d.id === curDiff() ? ' active' : '');
      card.style.setProperty('--c', d.color);
      card.innerHTML =
        '<div class="dname">' + d.name + '</div>' +
        '<div class="dsub">' + d.sub + '</div>' +
        '<div class="dbest">' + (best > 0 ? 'Record ' + U.fmtTime(best) : 'Jamais tenté') + '</div>';
      card.addEventListener('click', () => { setDiff(d.id); savePrefs(); buildMenu(); });
      el.list.appendChild(card);
    }
    renderDetails();
    renderToggles();
    renderControls();
  }

  function renderDetails() {
    const cfg = C();
    const d = cfg.diff(curDiff());
    el.details.style.setProperty('--c', d.color);
    el.details.innerHTML =
      '<h3>' + d.name + '</h3>' +
      '<p>' + d.blurb + '</p>' +
      '<ul>' + d.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>' +
      '<p style="margin-top:10px;color:#8a92b8">Premier objectif : <b style="color:' + d.color + '">' +
        d.objectives[0].label + '</b> → ' + cfg.BUFFS[d.objectives[0].reward].name + '</p>' +
      (d.impossible
        ? '<p class="warn">⚠ Ce mode n\'est pas équilibré pour un joueur humain. Il existe pour mesurer un plafond, ou pour tester un bot.</p>'
        : '');
  }

  function renderToggles() {
    // Le terrain procédural n'existe que dans le mode classique.
    el.terrainRow.style.display = isLol() ? 'none' : '';

    document.querySelectorAll('.toggle').forEach(btn => {
      const opt = btn.dataset.opt;
      const val = btn.dataset.val === 'true' ? true : (btn.dataset.val === 'false' ? false : btn.dataset.val);
      btn.classList.toggle('on', prefs[opt] === val);
      btn.onclick = () => {
        prefs[opt] = val;
        savePrefs();
        if (opt === 'endless') buildMenu(); else renderToggles();
      };
    });

    el.terrainHint.textContent = prefs.endless
      ? 'Secteurs générés à l\'infini : piliers qui bloquent les tirs, flaques qui ralentissent, plaques qui rechargent le dash. Le champ d\'effondrement te poursuit à 52 % de ta vitesse — fuir marche, mais chaque seconde passée à courir est une seconde sans frôlement, donc sans adrénaline.'
      : 'Arène fermée qui rétrécit par paliers. Le terrain de référence : rien à fuir, tout à lire. C\'est ici que les records comptent.';
  }

  function renderControls() {
    el.controls.innerHTML = mode().controls
      .map(c => '<span><b>' + c[0] + '</b> ' + c[1] + '</span>').join('');
  }

  /* --- Transitions d'écran ---------------------------------------------------- */
  function show(n) { n.classList.remove('hidden'); }
  function hide(n) { n.classList.add('hidden'); }

  function toMenu() {
    game.state = 'menu';
    lolGame.state = 'menu';
    hide(el.pause); hide(el.dead); show(el.menu);
    buildMenu();
  }

  function startRun() {
    hide(el.menu); hide(el.dead); hide(el.pause);
    // L'autre moteur est mis au repos : un seul tourne à la fois.
    (isLol() ? game : lolGame).state = 'menu';
    G().start(curDiff(), { endless: prefs.endless, quality: prefs.quality, shake: prefs.shake });
  }

  /* --- Écran de mort ----------------------------------------------------------- */
  function stat(k, v, record) {
    return '<div class="stat' + (record ? ' record' : '') + '"><div class="k">' + k +
           '</div><div class="v">' + v + '</div></div>';
  }

  game.onDeath = function () {
    const d = game.diff, nx = game.objectives.next();
    el.cause.textContent = game.deathCause;
    el.stats.innerHTML =
      stat('Temps tenu', U.fmtTime(game.elapsed), game.newRecord) +
      stat('Record', U.fmtTime(game.best), game.newRecord) +
      stat('Objectifs', game.objectives.completed + ' / ' + d.objectives.length) +
      stat('Frôlements', String(game.stats.graze)) +
      stat('Intensité atteinte', '×' + game.director.I.toFixed(2)) +
      stat('Dashs utilisés', String(game.stats.dashes));

    let v = game.newRecord
      ? '<b>Nouveau record.</b> '
      : 'Il manquait <b>' + (game.best - game.elapsed).toFixed(2) + 's</b> pour battre ton record. ';
    v += nx
      ? 'Prochain objectif raté de <b>' + Math.max(0, nx.t - game.elapsed).toFixed(1) + 's</b> : ' +
        nx.label + ' (' + CFG.BUFFS[nx.reward].name + ').'
      : 'Tous les objectifs étaient validés — il ne restait que la survie.';
    if (game.objectives.failed > 0) {
      v += ' <b>' + game.objectives.failed + '</b> défi(s) raté(s) : autant de vagues de punition subies.';
    }
    if (game.stats.graze < game.elapsed * 0.5 && !d.impossible) {
      v += ' Tu joues loin des balles — le frôlement est la seule source d\'adrénaline.';
    }
    el.verdict.innerHTML = v;
    show(el.dead);
  };

  lolGame.onDeath = function () {
    const d = lolGame.diff, s = lolGame.stats, nx = lolGame.objectives.next();
    el.cause.textContent = lolGame.deathCause;
    el.stats.innerHTML =
      stat('Temps tenu', U.fmtTime(lolGame.elapsed), lolGame.newRecord) +
      stat('Record', U.fmtTime(lolGame.best), lolGame.newRecord) +
      stat('Objectifs', lolGame.objectives.completed + ' / ' + d.objectives.length) +
      stat('Esquives de justesse', String(s.jukes)) +
      stat('CC subis', String(s.ccTaken)) +
      stat('Bloqués par un sbire', String(s.blocked));

    let v = lolGame.newRecord
      ? '<b>Nouveau record.</b> '
      : 'Il manquait <b>' + (lolGame.best - lolGame.elapsed).toFixed(2) + 's</b> pour battre ton record. ';
    v += nx
      ? 'Prochain objectif raté de <b>' + Math.max(0, nx.t - lolGame.elapsed).toFixed(1) + 's</b> : ' +
        nx.label + ' (' + LOLCFG.BUFFS[nx.reward].name + ').'
      : 'Tous les objectifs étaient validés — il ne restait que la survie.';
    if (lolGame.objectives.failed > 0) {
      v += ' <b>' + lolGame.objectives.failed + '</b> défi(s) raté(s).';
    }
    // Diagnostic propre au dodge LoL : le nombre d'ordres donnés dit tout.
    const ordersPerSec = s.orders / Math.max(1, lolGame.elapsed);
    if (ordersPerSec < 0.55 && !d.impossible) {
      v += ' <b>Tu cliques trop peu</b> (' + ordersPerSec.toFixed(2) + ' ordre/s) : ils visent ton ordre de déplacement, ' +
           'donc marcher en ligne droite revient à leur offrir la cible. Re-clique pendant leur incantation.';
    } else if (s.ccTaken > 0 && s.ccTaken >= lolGame.elapsed / 12) {
      v += ' Tu manges beaucoup de CC : un enracinement ne tue pas, c\'est le sort suivant qui tue. Garde la Purge pour ça.';
    }
    el.verdict.innerHTML = v;
    show(el.dead);
  };

  /* --- Contrôles globaux -------------------------------------------------------- */
  el.start.addEventListener('click', startRun);
  el.retry.addEventListener('click', startRun);
  el.resume.addEventListener('click', () => {
    G().state = 'playing'; hide(el.pause);
    root.Input.clearAll(); root.LolInput.clearAll();
  });
  el.quit.addEventListener('click', toMenu);
  el.toMenu.addEventListener('click', toMenu);

  root.addEventListener('keydown', e => {
    const g = G();
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (g.state === 'playing') { g.state = 'paused'; show(el.pause); }
      else if (g.state === 'paused') {
        g.state = 'playing'; hide(el.pause);
        root.Input.clearAll(); root.LolInput.clearAll();
      }
    }
    if (e.code === 'KeyR' && (g.state === 'dead' || g.state === 'paused')) startRun();
    if (e.code === 'Enter' && g.state === 'menu') startRun();
  });

  /* --- Boucle principale ---------------------------------------------------------- */
  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 120;          // pas fixe : les collisions ne sautent rien

  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;

    const g = G();
    if (g.state === 'playing') {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard++ < 8) {
        acc -= STEP;
        g.update(STEP);
        if (g.state !== 'playing') { acc = 0; break; }
      }
    } else if (g.state === 'dead') {
      g.fx.update(dt);
    }
    g.render();
  }

  buildMenu();
  requestAnimationFrame(frame);
})(window);
</script>
</body>
